<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devotion</title>
<script>
// Before the page paints: the theme, the wallpaper and the window opacity this browser chose.
try {
	const t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
	const w = localStorage.getItem('read.wallpaper'); if (w && /^[A-Za-z0-9]{1,16}$/.test(w)) document.documentElement.dataset.wallpaper = w;
	const o = Number(localStorage.getItem('read.opacity')); if (o >= 50 && o <= 100) document.documentElement.style.setProperty('--win', o / 100);
} catch {}
</script>
<style>
:root { color-scheme: light; --bg:#f6f4ef; --card:#fff; --raised:#faf8f4; --ink:#22201c; --muted:#6b665d; --line:#ddd8cc; --accent:#3d5a80; --win:1; }
:root[data-theme="dark"] { color-scheme: dark; --bg:#191816; --card:#232220; --raised:#2b2a27; --ink:#ece8df; --muted:#a39d91; --line:#3a3834; --accent:#8fb3de; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg:#191816; --card:#232220; --raised:#2b2a27; --ink:#ece8df; --muted:#a39d91; --line:#3a3834; --accent:#8fb3de; } }
* { box-sizing: border-box; }
html { background:var(--bg); }
body { margin:0; min-height:100vh; color:var(--ink); font:16px/1.6 system-ui, sans-serif; background:var(--bg) center / cover no-repeat fixed; }

/* Windows: the text sits on these; with a wallpaper, it shows around them. */
.window { background:color-mix(in srgb, var(--card) calc(var(--win) * 100%), transparent); border:1px solid var(--line); border-radius:16px; }
:root:not([data-wallpaper]) .window { border-color:transparent; background:var(--bg); border-radius:0; }
:root[data-wallpaper] .window { box-shadow:0 8px 32px rgba(0,0,0,.18); -webkit-backdrop-filter:blur(calc((1 - var(--win)) * 24px)); backdrop-filter:blur(calc((1 - var(--win)) * 24px)); }

.shell { max-width:44rem; margin:0 auto; padding:0 1rem 2rem; }
:root[data-wallpaper] .shell { padding:12px 12px 24px; }
.top { padding:.8rem 1rem 0; margin-bottom:12px; }
:root:not([data-wallpaper]) .top { position:sticky; top:0; z-index:2; border-bottom:1px solid var(--line); padding:.8rem 0 0; }
.bar { display:flex; align-items:center; gap:.9rem; flex-wrap:wrap; }
.bar h1 { font-size:1.25rem; margin:0; flex:1; }
.bar a, .bar button { color:var(--accent); text-decoration:none; background:none; border:0; font:inherit; font-size:.9rem; cursor:pointer; padding:.3rem 0; }
.tabs { display:flex; gap:1.4rem; margin-top:.4rem; }
@media (max-width: 520px) { .bar { gap:.7rem; } .bar .prefix { display:none; } }
.tabs button { background:none; border:0; border-bottom:3px solid transparent; padding:.5rem 0; font:inherit; font-weight:600; color:var(--muted); cursor:pointer; }
.tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
.pane { padding:1rem; }
:root:not([data-wallpaper]) .pane { padding:0; }
#entry-pane:empty { display:none; }

.item { display:block; width:100%; text-align:left; background:var(--raised); border:1px solid var(--line); border-radius:10px; padding:.8rem .9rem; margin:0 0 .6rem; color:var(--ink); text-decoration:none; }
.item:hover, .item[aria-current="true"] { border-color:var(--accent); }
.label { font-size:.8rem; font-weight:600; color:var(--accent); }
.title { font-weight:600; font-size:1.05rem; margin:.1rem 0; }
.muted { color:var(--muted); } .small { font-size:.85rem; }
.summary { color:var(--muted); font-size:.92rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.pill { display:inline-block; font-size:.72rem; border:1px solid var(--line); border-radius:999px; padding:0 .5rem; margin-left:.4rem; color:var(--muted); vertical-align:middle; font-weight:500; }
article h2 { font-size:1.6rem; line-height:1.25; margin:.2rem 0 .3rem; }
.card { background:var(--raised); border:1px solid var(--line); border-radius:10px; padding:.9rem 1rem; margin:1rem 0; }
.player { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; }
.player audio { width:100%; }
select, input[type=range] { font:inherit; font-size:.85rem; accent-color:var(--accent); }
select { padding:.25rem .4rem; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
.body p { margin:0 0 1em; }
.body p.head { font-weight:600; margin-top:1.4em; }
.empty { text-align:center; color:var(--muted); padding:3rem 0; }
.back { color:var(--accent); font-size:.9rem; text-decoration:none; }

/* Desktop: the list on the left, the open entry on the right. */
@media (min-width: 960px) {
	.shell { max-width:76rem; padding:0 2rem 2rem; }
	:root[data-wallpaper] .shell { padding:24px 32px 32px; }
	.columns { display:grid; grid-template-columns:minmax(20rem, 26rem) 1fr; gap:24px; align-items:start; }
	:root:not([data-wallpaper]) .columns { gap:2rem; }
	#list-pane { position:sticky; top:calc(var(--top-h, 7rem) + 12px); max-height:calc(100vh - var(--top-h, 7rem) - 48px); overflow:auto; }
	#entry-pane:empty { display:block; }
	#entry-pane:empty::before { content:'Choose a reading on the left.'; display:block; color:var(--muted); text-align:center; padding:4rem 0; }
	.back { display:none; }
	article { max-width:42rem; margin:0 auto; font-size:1.05rem; }
	:root:not([data-wallpaper]) #entry-pane { border-left:1px solid var(--line); padding-left:2rem; }
}
@media (max-width: 959px) { body.reading #list-pane { display:none; } }

/* Appearance */
dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); width:min(40rem, calc(100vw - 2rem)); padding:1rem 1.1rem; }
dialog::backdrop { background:rgba(0,0,0,.45); }
dialog h2 { font-size:1.1rem; margin:0 0 .6rem; }
.chips { display:flex; gap:.4rem; flex-wrap:wrap; margin:.4rem 0 .6rem; }
.chip { padding:.2rem .7rem; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink); font:inherit; font-size:.85rem; cursor:pointer; }
.chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--card); }
.walls { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:.5rem; max-height:16rem; overflow:auto; }
.wall { aspect-ratio:9/16; border-radius:8px; overflow:hidden; border:2px solid transparent; padding:0; cursor:pointer; background:var(--line) center / cover; }
.wall[aria-pressed="true"] { border-color:var(--accent); }
.wall.none { display:grid; place-items:center; font-size:.8rem; color:var(--muted); background:var(--bg); border:1px dashed var(--line); }
.slider { display:flex; align-items:center; gap:.7rem; margin-top:1rem; }
.slider input { flex:1; }
.row { display:flex; justify-content:flex-end; gap:.5rem; margin-top:1rem; }
.row button { font:inherit; padding:.4rem .9rem; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--card); cursor:pointer; }
</style>
</head>
<body>
<div class="shell">
	<header class="top window" id="top">
		<div class="bar"><h1>Devotion</h1><button id="appearance" type="button">Wallpaper</button><button id="theme" type="button"></button><a href="/">Home</a></div>
		<div class="tabs" role="tablist">
			<button role="tab" data-tab="daily_reading">Daily readings</button>
			<button role="tab" data-tab="lesson">Lessons</button>
		</div>
	</header>
	<div class="columns">
		<section class="pane window" id="list-pane" aria-label="Readings"></section>
		<section class="pane window" id="entry-pane" aria-live="polite"></section>
	</div>
</div>

<dialog id="look">
	<h2>Wallpaper</h2>
	<p class="small muted" id="look-note">Wallpapers from this server (from wallhaven.cc). Your choice is kept in this browser.</p>
	<div class="chips" id="look-topics"></div>
	<div class="walls" id="look-walls"></div>
	<label class="slider small"><span>Text window opacity</span><input type="range" id="look-opacity" min="50" max="100" step="1"><span id="look-value"></span></label>
	<div class="row"><button type="button" id="look-done">Done</button></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const root = document.documentElement;
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const store = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
let entries = [], voices = { voices: [], default: null }, tab = store.get('read.tab', 'daily_reading');
const wide = window.matchMedia('(min-width: 960px)');

// Dates are written in the reader's own language; taken at noon UTC so no time zone moves them a day.
const day = (iso, opts) => iso && /^\d{4}-\d{2}-\d{2}/.test(iso) ? new Date(iso.slice(0, 10) + 'T12:00:00Z').toLocaleDateString(undefined, { timeZone: 'UTC', ...opts }) : '';
const kindOf = (e) => (e.kind === 'lesson' ? 'lesson' : 'daily_reading');
function heading(e) {
	if (kindOf(e) === 'lesson') return [e.lesson_number ? `Lesson ${e.lesson_number}` : '', day(e.entry_date, { month: 'long', day: 'numeric', year: 'numeric' })].filter(Boolean).join(' · ') || 'Lesson';
	return day(e.entry_date || e.created_at, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}
const sortKey = (e) => (e.entry_date || e.created_at || '') + '|' + (e.created_at || '') + '|' + String(e.id).padStart(9, '0');

// --- Theme ----------------------------------------------------------------------
function renderTheme() {
	const mode = { auto: 'System', light: 'Light', dark: 'Dark' }[root.dataset.theme || 'auto'];
	$('theme').replaceChildren(el('span', 'Theme: ', 'prefix'), mode);
	$('theme').title = 'Theme: ' + mode.toLowerCase();
}
$('theme').onclick = () => {
	const next = { auto: 'light', light: 'dark', dark: 'auto' }[root.dataset.theme || 'auto'];
	if (next === 'auto') delete root.dataset.theme; else root.dataset.theme = next;
	store.set('theme', next === 'auto' ? null : next);
	renderTheme();
};

// --- Wallpaper and window opacity -------------------------------------------------
let library = { topics: [], wallpapers: [] }, lookTopic = 'all';
function applyWallpaper() {
	const id = root.dataset.wallpaper;
	document.body.style.backgroundImage = id ? `url("/api/wallpapers/${encodeURIComponent(id)}")` : '';
	$('appearance').textContent = id ? 'Wallpaper ✓' : 'Wallpaper';
	measureTop();
}
function setWallpaper(id) {
	if (id) root.dataset.wallpaper = id; else delete root.dataset.wallpaper;
	store.set('read.wallpaper', id || null);
	applyWallpaper(); renderLook();
}
function setOpacity(pct) {
	const v = Math.max(50, Math.min(100, Number(pct) || 100));
	root.style.setProperty('--win', v / 100);
	store.set('read.opacity', String(v));
	$('look-opacity').value = v; $('look-value').textContent = v + '%';
}
function renderLook() {
	const chips = $('look-topics'); chips.replaceChildren();
	const all = [{ id: 'all', name: 'All', count: library.wallpapers.length }, ...library.topics];
	if (!all.some((t) => t.id === lookTopic)) lookTopic = 'all';
	for (const t of all) {
		const b = el('button', `${t.name} ${t.count}`, 'chip'); b.type = 'button';
		b.setAttribute('aria-pressed', String(t.id === lookTopic));
		b.onclick = () => { lookTopic = t.id; renderLook(); };
		chips.append(b);
	}
	const grid = $('look-walls'); grid.replaceChildren();
	const none = el('button', 'None', 'wall none'); none.type = 'button';
	none.setAttribute('aria-pressed', String(!root.dataset.wallpaper)); none.onclick = () => setWallpaper(null);
	grid.append(none);
	for (const w of library.wallpapers.filter((w) => lookTopic === 'all' || w.topic === lookTopic)) {
		const b = el('button', null, 'wall'); b.type = 'button';
		b.style.backgroundColor = w.colors?.[0] || '';
		b.style.backgroundImage = `url("/api/wallpapers/${encodeURIComponent(w.id)}/thumb")`;
		b.setAttribute('aria-label', `Wallpaper ${w.id}`);
		b.setAttribute('aria-pressed', String(root.dataset.wallpaper === w.id));
		b.onclick = () => setWallpaper(w.id);
		grid.append(b);
	}
	$('look-note').textContent = library.wallpapers.length
		? 'Wallpapers from this server (from wallhaven.cc). Your choice is kept in this browser.'
		: 'This server has no wallpapers yet: they are added on its admin panel.';
	$('look-opacity').disabled = !root.dataset.wallpaper;
}
$('appearance').onclick = async () => {
	try { library = await (await fetch('/api/wallpapers')).json(); } catch { library = { topics: [], wallpapers: [] }; }
	renderLook(); $('look').showModal();
};
$('look-done').onclick = () => $('look').close();
$('look-opacity').oninput = (e) => setOpacity(e.target.value);

// --- Readings -------------------------------------------------------------------
for (const b of document.querySelectorAll('[data-tab]')) b.onclick = () => { tab = b.dataset.tab; store.set('read.tab', tab); if (location.hash) location.hash = ''; else render(); };

function renderList(pane, currentId) {
	const list = entries.filter((e) => kindOf(e) === tab).sort((a, b) => sortKey(b).localeCompare(sortKey(a)));
	if (!list.length) { pane.append(el('p', tab === 'lesson' ? 'No lessons yet.' : 'No daily readings yet.', 'empty')); return; }
	for (const e of list) {
		const a = el('a', null, 'item'); a.href = `#/entry/${e.id}`;
		if (e.id === currentId) a.setAttribute('aria-current', 'true');
		const label = el('div', heading(e), 'label');
		if (kindOf(e) === 'daily_reading' && e.lesson_number) label.append(el('span', `Lesson ${e.lesson_number}`, 'pill'));
		if (e.archived) label.append(el('span', 'Archived', 'pill'));
		a.append(label, el('div', e.title, 'title'));
		if (e.summary) a.append(el('div', e.summary, 'summary'));
		pane.append(a);
	}
}

function renderEntry(pane, e) {
	const back = el('a', '← Back', 'back'); back.href = '#';
	const art = el('article');
	art.append(back, el('div', heading(e), 'label'), el('h2', e.title));
	if (e.scripture) art.append(el('div', e.scripture, 'muted'));
	if (e.summary) { const s = el('div', null, 'card'); s.append(el('div', 'Summary', 'label'), el('div', e.summary)); art.append(s); }

	const audio = (e.audio && e.audio.length) ? e.audio : e.has_audio ? [{ voice: '' }] : [];
	if (audio.length) {
		const box = el('div', null, 'card player');
		const player = el('audio'); player.controls = true; player.preload = 'none';
		const voiceSel = el('select'); voiceSel.setAttribute('aria-label', 'Voice');
		const nameOf = (id) => voices.voices.find((v) => v.id === id)?.name || id || 'Default voice';
		for (const a of audio) { const o = el('option', nameOf(a.voice)); o.value = a.voice; voiceSel.append(o); }
		const preferred = store.get('read.voice', voices.default || '');
		voiceSel.value = audio.some((a) => a.voice === preferred) ? preferred : audio.some((a) => a.voice === voices.default) ? voices.default : audio[0].voice;
		const speedSel = el('select'); speedSel.setAttribute('aria-label', 'Speed');
		for (const s of ['0.75', '1', '1.25', '1.5', '1.75', '2']) { const o = el('option', s + '×'); o.value = s; speedSel.append(o); }
		speedSel.value = store.get('read.speed', '1');
		const load = (keepTime) => {
			const t = player.currentTime, playing = !player.paused;
			player.src = `/api/entries/${e.id}/audio` + (voiceSel.value ? `?voice=${encodeURIComponent(voiceSel.value)}` : '');
			player.playbackRate = Number(speedSel.value);
			if (keepTime) player.addEventListener('loadedmetadata', () => { player.currentTime = t; if (playing) player.play().catch(() => {}); }, { once: true });
		};
		voiceSel.onchange = () => { store.set('read.voice', voiceSel.value); load(true); };
		speedSel.onchange = () => { store.set('read.speed', speedSel.value); player.playbackRate = Number(speedSel.value); };
		player.addEventListener('play', () => { player.playbackRate = Number(speedSel.value); });
		load(false);
		box.append(player);
		if (audio.length > 1) box.append(voiceSel);
		box.append(speedSel);
		art.append(box);
	}

	const body = el('div', null, 'body');
	if (e.body) {
		for (const para of e.body.split(/\n{2,}/)) {
			const text = para.trim(); if (!text) continue;
			// A short line on its own ("Prayer", "Lesson Scripture") reads as a heading.
			body.append(el('p', text, text.length < 40 && !/[.!?”"]$/.test(text) ? 'head' : ''));
		}
	} else if (e.archived) {
		body.append(el('p', 'Archived on the server: the full text is no longer available here.', 'muted'));
	}
	art.append(body);
	pane.append(art);
}

function render() {
	for (const b of document.querySelectorAll('[data-tab]')) b.setAttribute('aria-selected', String(b.dataset.tab === tab));
	const m = /^#\/entry\/(\d+)$/.exec(location.hash);
	let entry = m && entries.find((e) => e.id === Number(m[1]));
	if (entry && kindOf(entry) !== tab) entry = null; // switching tab closes it
	const listPane = $('list-pane'), entryPane = $('entry-pane');
	listPane.replaceChildren(); entryPane.replaceChildren();
	renderList(listPane, entry?.id);
	if (entry) { renderEntry(entryPane, entry); if (!wide.matches) window.scrollTo(0, 0); else entryPane.scrollIntoView({ block: 'nearest' }); }
	document.body.classList.toggle('reading', Boolean(entry));
}
window.addEventListener('hashchange', render);

// The list beside a reading stays in view under the header on desktop.
function measureTop() { requestAnimationFrame(() => root.style.setProperty('--top-h', $('top').offsetHeight + 'px')); }
window.addEventListener('resize', measureTop);

renderTheme(); applyWallpaper();
setOpacity(store.get('read.opacity', '100'));
Promise.all([
	fetch('/api/entries').then((r) => r.json()),
	fetch('/api/voices').then((r) => (r.ok ? r.json() : { voices: [], default: null })).catch(() => ({ voices: [], default: null })),
]).then(([list, v]) => {
	entries = list.entries || []; voices = v;
	const m = /^#\/entry\/(\d+)$/.exec(location.hash);
	const linked = m && entries.find((e) => e.id === Number(m[1]));
	if (linked) tab = kindOf(linked); // a link to a reading opens on its tab
	render();
}).catch(() => { $('list-pane').replaceChildren(el('p', 'Could not load the entries. Try again in a moment.', 'empty')); });
</script>
</body>
</html>
