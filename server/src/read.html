<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devotion</title>
<script>
// Before the page paints: this browser's theme, wallpaper (and which part of it), opacity and shade.
try {
	const t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
	const w = localStorage.getItem('read.wallpaper'); if (w && /^[A-Za-z0-9]{1,16}$/.test(w)) document.documentElement.dataset.wallpaper = w;
	const x = localStorage.getItem('read.wallBias'); if (x !== null && Number(x) >= 0 && Number(x) <= 1) document.documentElement.style.setProperty('--wall-x', Number(x));
	const o = Number(localStorage.getItem('read.opacity')); if (o >= 50 && o <= 100) document.documentElement.style.setProperty('--win', o / 100);
	const s = localStorage.getItem('read.itemShade'); if (s !== null && Number(s) >= 0 && Number(s) <= 100) document.documentElement.style.setProperty('--shade', Number(s) / 100);
	const r = Number(localStorage.getItem('read.split')); if (r >= 0.2 && r <= 0.8) document.documentElement.style.setProperty('--split', r);
} catch {}
</script>
<style>
:root { color-scheme: light; --bg:#f6f4ef; --card:#fffdf9; --ink:#22201c; --muted:#6b665d; --line:#ddd8cc; --accent:#3d5a80; --mark:#f6e7a8; --win:1; --shade:.4; --split:.5; --wall-x:.5; --hl-yellow:#fff176; --hl-green:#c5e1a5; --hl-blue:#a9d4fa; --hl-pink:#f8bbd0; }
:root[data-theme="dark"] { color-scheme: dark; --bg:#191816; --card:#25241f; --ink:#ece8df; --muted:#a39d91; --line:#3a3834; --accent:#8fb3de; --mark:#5b4e1f; --hl-yellow:#6b5a00; --hl-green:#2b5e2f; --hl-blue:#1d4e80; --hl-pink:#7a2f58; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg:#191816; --card:#25241f; --ink:#ece8df; --muted:#a39d91; --line:#3a3834; --accent:#8fb3de; --mark:#5b4e1f; --hl-yellow:#6b5a00; --hl-green:#2b5e2f; --hl-blue:#1d4e80; --hl-pink:#7a2f58; } }
* { box-sizing: border-box; }
html { background:var(--bg); }
body { margin:0; min-height:100vh; color:var(--ink); font:16px/1.6 system-ui, sans-serif; background:var(--bg) center / cover no-repeat fixed; background-position:calc(var(--wall-x) * 100%) 50%; }
button, input, select { font:inherit; color:inherit; }

/* Windows, as in the app: the window colour at the chosen opacity, nothing blurred behind it. */
.window { --win-bg: var(--card); background:color-mix(in srgb, var(--win-bg) calc(var(--win) * 100%), transparent); border:1px solid var(--line); border-radius:16px; }
:root:not([data-wallpaper]) .window { --win-bg: var(--bg); background:var(--bg); border-color:transparent; border-radius:0; }
:root[data-wallpaper] .window { box-shadow:0 6px 24px rgba(0,0,0,.16); }
/* Items in a window are the window's colour made darker (the shade slider), never more see-through than it. */
.item, .cell, .window select { background:color-mix(in srgb, color-mix(in srgb, var(--win-bg), #000 calc(var(--shade) * 22%)) calc(var(--win) * 100%), transparent); border:1px solid var(--line); border-radius:10px; color:var(--ink); }
:root:not([data-wallpaper]) .item, :root:not([data-wallpaper]) .cell, :root:not([data-wallpaper]) .window select { background:color-mix(in srgb, var(--bg), #000 calc(var(--shade) * 10%)); }

.shell { padding:0 1rem 2rem; max-width:44rem; margin:0 auto; }
:root[data-wallpaper] .shell { padding:12px 12px 24px; }
.top { padding:.6rem 1rem 0; margin-bottom:12px; }
:root:not([data-wallpaper]) .top { position:sticky; top:0; z-index:2; border-bottom:1px solid var(--line); padding:.6rem 0 0; }
.bar { display:flex; align-items:center; gap:.4rem; }
.bar h1 { font-size:1.25rem; margin:0; flex:1; }
.icon { display:inline-grid; place-items:center; width:2.2rem; height:2.2rem; border-radius:50%; color:var(--ink); background:none; border:0; cursor:pointer; text-decoration:none; flex:none; }
.icon:hover { background:color-mix(in srgb, var(--ink) 8%, transparent); }
.icon svg { width:1.3rem; height:1.3rem; }
.tabs { display:flex; gap:1.4rem; margin-top:.1rem; }
.tabs button { background:none; border:0; border-bottom:3px solid transparent; padding:.5rem 0; font-weight:600; color:var(--muted); cursor:pointer; }
.tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
.pane { padding:1rem; min-width:0; }
:root:not([data-wallpaper]) .pane { padding:0; }
.pane-head { display:flex; align-items:center; gap:.5rem; margin:-.2rem 0 .6rem; }
/* Back and close float over the text as solid bubbles, staying in reach while it scrolls. */
.floaters { position:sticky; top:0; height:0; z-index:2; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
.floaters > * { pointer-events:auto; }
.floaters .close { margin-left:auto; }
.bubble { background:var(--card); color:var(--ink); border:1px solid var(--line); box-shadow:0 2px 10px rgba(0,0,0,.18); border-radius:999px; cursor:pointer; }
.bubble.back { display:inline-flex; align-items:center; gap:.3rem; padding:.35rem .9rem; font-size:.9rem; font-weight:600; color:var(--accent); text-decoration:none; background:var(--card); border:1px solid var(--line); }
.bubble.icon { width:2.3rem; height:2.3rem; }
.bubble.icon:hover { background:var(--card); border-color:var(--accent); }
.pane-head.room { padding-right:2.8rem; }
@media (max-width: 959px) { .below-floaters, .pane-head.room-left-narrow { padding-top:2.8rem; } }
.pane-head .grow { flex:1; min-width:0; }
.pane-head select { max-width:100%; }
.close { display:none; }
.spacer { flex:1; }

.item { display:block; width:100%; text-align:left; padding:.8rem .9rem; margin:0 0 .6rem; text-decoration:none; cursor:pointer; }
.item:hover, .item[aria-current="true"], .cell:hover, .cell[aria-current="true"] { border-color:var(--accent); }
.label { font-size:.8rem; font-weight:600; color:var(--accent); }
.title { font-weight:600; font-size:1.05rem; margin:.1rem 0; }
.muted { color:var(--muted); } .small { font-size:.85rem; }
.summary { color:var(--muted); font-size:.92rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.pill { display:inline-block; font-size:.72rem; border:1px solid var(--line); border-radius:999px; padding:0 .5rem; margin-left:.4rem; color:var(--muted); vertical-align:middle; font-weight:500; }
article h2, .verses-wrap h2 { font-size:1.6rem; line-height:1.25; margin:.2rem 0 .3rem; }
.card { background:color-mix(in srgb, color-mix(in srgb, var(--win-bg), #000 calc(var(--shade) * 22%)) calc(var(--win) * 100%), transparent); border:1px solid var(--line); border-radius:10px; padding:.9rem 1rem; margin:1rem 0; }
:root:not([data-wallpaper]) .card { background:color-mix(in srgb, var(--bg), #000 calc(var(--shade) * 10%)); }
.player { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; }
.player audio { width:100%; }
/* Selectors (version, book, chapter, verse, voice, speed) are shaded like list items; their open lists are plain. */
select { padding:.3rem .5rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
select option { background:var(--card); color:var(--ink); }
/* The follow-along button sits between the voice and the speed and looks like them. */
.follow { padding:.3rem .7rem; border:1px solid var(--line); border-radius:8px; color:var(--ink); cursor:pointer; background:color-mix(in srgb, color-mix(in srgb, var(--win-bg), #000 calc(var(--shade) * 22%)) calc(var(--win) * 100%), transparent); }
:root:not([data-wallpaper]) .follow { background:color-mix(in srgb, var(--bg), #000 calc(var(--shade) * 10%)); }
.follow[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); font-weight:600; }
.scrollctl { display:inline-flex; align-items:center; gap:.3rem; }
.follow.step { min-width:2.1rem; padding:.3rem 0; text-align:center; font-weight:600; }
.follow.step:disabled { opacity:.4; cursor:default; }
.follow[hidden], .player select[hidden] { display:none; }

/* Highlights and comments, shared with the app */
.hl-yellow { background:var(--hl-yellow); } .hl-green { background:var(--hl-green); } .hl-blue { background:var(--hl-blue); } .hl-pink { background:var(--hl-pink); }
[data-note] { cursor:pointer; border-radius:2px; }
.marker { user-select:none; -webkit-user-select:none; cursor:pointer; font-size:.85em; margin:0 .1em; background:none; border:0; padding:0; }
.selbar { position:fixed; z-index:20; display:flex; align-items:center; gap:.35rem; padding:.35rem .5rem; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:999px; box-shadow:0 4px 18px rgba(0,0,0,.25); }
.selbar[hidden] { display:none; }
.swatch { width:1.7rem; height:1.7rem; border-radius:50%; border:1px solid var(--line); cursor:pointer; padding:0; }
.swatch.none { background:transparent; position:relative; }
.swatch.none::after { content:''; position:absolute; left:50%; top:15%; height:70%; border-left:2px solid var(--muted); transform:rotate(45deg); }
.swatch[aria-pressed="true"] { outline:3px solid var(--accent); outline-offset:1px; }
.selbar .chip { white-space:nowrap; }
.notes h3 { font-size:1rem; margin:1.6rem 0 .5rem; }
.note { display:flex; gap:.6rem; align-items:flex-start; width:100%; text-align:left; padding:.6rem .8rem; margin:0 0 .5rem; cursor:pointer; }
.note .dot { flex:none; width:.8rem; height:.8rem; border-radius:50%; margin-top:.45rem; border:1px solid var(--line); }
.note q { display:block; font-style:italic; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.note .what { white-space:pre-wrap; }
#note-dlg textarea { width:100%; min-height:7rem; padding:.55rem .7rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; margin:.6rem 0; resize:vertical; }
#note-dlg blockquote { margin:.4rem 0; padding-left:.7rem; border-left:3px solid var(--line); color:var(--muted); font-style:italic; max-height:6rem; overflow:auto; }
.toast { position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); z-index:30; background:var(--ink); color:var(--bg); padding:.55rem 1rem; border-radius:10px; max-width:calc(100vw - 2rem); box-shadow:0 4px 18px rgba(0,0,0,.3); }
.toast[hidden] { display:none; }
.body p { margin:0 0 1em; }
.body p.head { font-weight:600; margin-top:1.4em; }
.body a { color:var(--accent); text-decoration:underline; text-underline-offset:2px; cursor:pointer; }
.empty { text-align:center; color:var(--muted); padding:3rem 0; }
.back { color:var(--accent); font-size:.9rem; text-decoration:none; background:none; border:0; padding:0; cursor:pointer; }

/* Bible */
.books { display:grid; grid-template-columns:repeat(auto-fill, minmax(9rem, 1fr)); gap:.4rem; }
.cell { padding:.45rem .7rem; cursor:pointer; font-size:.95rem; text-decoration:none; display:block; }
.verses p { margin:0 0 .5em; }
.verses sup { color:var(--muted); font-size:.7em; margin-right:.25em; }
.verses.can-start sup { cursor:pointer; color:var(--accent); padding:.3em .2em; }
.verses .hit { background:var(--mark); border-radius:4px; box-shadow:0 0 0 3px var(--mark); }
.chapnav { display:flex; justify-content:space-between; gap:.5rem; margin-top:1rem; }
.chapnav button { background:none; border:1px solid var(--line); border-radius:8px; padding:.35rem .8rem; cursor:pointer; color:var(--accent); }
.chapnav button:disabled { opacity:.4; cursor:default; }

/* Settings page */
.settings { max-width:44rem; margin:0 auto; }
.settings h2 { font-size:1.4rem; margin:.3rem 0 1rem; }
.settings h3 { font-size:1rem; margin:1.4rem 0 .5rem; }
.choices { display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; }
.chip { padding:.25rem .8rem; border-radius:999px; border:1px solid var(--line); background:transparent; cursor:pointer; font-size:.9rem; }
.chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--card); }
.walls { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:.5rem; margin-top:.6rem; }
.wall { aspect-ratio:9/16; border-radius:8px; overflow:hidden; border:2px solid transparent; padding:0; cursor:pointer; background:var(--line) center / cover; }
.wall[aria-pressed="true"] { border-color:var(--accent); }
.wall.none { display:grid; place-items:center; font-size:.8rem; color:var(--muted); background:var(--bg); border:1px dashed var(--line); }
.settings input[type=time] { padding:.2rem .4rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
.settings input[type=time]:disabled { opacity:.5; }
.slider { display:flex; align-items:center; gap:.7rem; margin-top:.6rem; }
.slider input { flex:1; accent-color:var(--accent); }
.slider span:first-child { min-width:8rem; }
.slider .val { min-width:3rem; text-align:right; color:var(--muted); }

/* Profile prompt */
dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); width:min(26rem, calc(100vw - 2rem)); padding:1.2rem; }
dialog::backdrop { background:rgba(0,0,0,.45); }
dialog h2 { margin:0 0 .3rem; font-size:1.2rem; }
dialog input[type=text] { width:100%; padding:.55rem .7rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); margin:.6rem 0; }
.btn { padding:.5rem 1rem; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--card); cursor:pointer; }
.btn.plain { background:transparent; color:var(--accent); }
.who { display:flex; flex-direction:column; gap:.4rem; margin:.6rem 0; }
.who button { text-align:left; }
.err { color:#a23b3b; font-size:.85rem; min-height:1.2em; }

#settings-pane { display:none; }
body.settings-open #columns { display:none; }
body.settings-open #settings-pane { display:block; }

/* Phone and narrow windows: one pane at a time. */
@media (max-width: 959px) {
	.columns > .pane:not(.shown) { display:none; }
	.handle { display:none; }
}

/* Desktop: the whole width. The list, then the reading and the Bible side by side with a divider to drag. */
@media (min-width: 960px) {
	.shell { max-width:none; padding:0 1.5rem 1.2rem; }
	:root[data-wallpaper] .shell { padding:16px 20px 16px; }
	.columns { display:grid; gap:16px; align-items:start; grid-template-columns:minmax(17rem, 22rem) minmax(0, var(--split-left, 1fr)) 8px minmax(0, var(--split-right, 1fr)); }
	.columns > .pane { position:sticky; top:calc(var(--top-h, 7rem) + 12px); height:calc(100vh - var(--top-h, 7rem) - 30px); overflow:auto; overscroll-behavior:contain; }
	:root:not([data-wallpaper]) .columns > .pane { height:calc(100vh - var(--top-h, 7rem) - 20px); }
	.columns.no-bible { grid-template-columns:minmax(17rem, 22rem) minmax(0, 1fr); }
	.columns.no-reading { grid-template-columns:minmax(17rem, 22rem) minmax(0, 1fr); }
	.columns.no-bible #bible-pane, .columns.no-bible .handle, .columns.no-reading #reading-pane, .columns.no-reading .handle { display:none; }
	.handle { position:sticky; top:calc(var(--top-h, 7rem) + 12px); height:calc(100vh - var(--top-h, 7rem) - 30px); cursor:col-resize; border-radius:4px; touch-action:none; display:grid; place-items:center; }
	.handle::after { content:''; width:4px; height:3rem; border-radius:2px; background:var(--line); }
	.handle:hover::after, .handle.dragging::after { background:var(--accent); }
	:root[data-wallpaper] .handle::after { background:rgba(255,255,255,.7); }
	.close { display:inline-grid; }
	.narrow-only { display:none !important; }
	article, .verses-wrap { max-width:46rem; margin:0 auto; }
	article { font-size:1.05rem; }
	.tabs button[data-tab="bible"][aria-pressed="true"] { color:var(--ink); }
	:root:not([data-wallpaper]) #bible-pane { border-left:1px solid var(--line); padding-left:1rem; }
}
</style>
</head>
<body>
<div class="shell">
	<header class="top window" id="top">
		<div class="bar">
			<h1>Devotion</h1>
			<a class="icon" href="#/settings" id="gear" title="Settings" aria-label="Settings">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
			</a>
			<a class="icon" href="/" title="Home" aria-label="Home">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
			</a>
		</div>
		<div class="tabs" role="tablist" id="tabs">
			<button role="tab" data-tab="daily_reading">Daily readings</button>
			<button role="tab" data-tab="lesson">Lessons</button>
			<button role="tab" data-tab="bible">Bible</button>
		</div>
	</header>
	<div class="columns" id="columns">
		<section class="pane window" id="list-pane" aria-label="Readings"></section>
		<section class="pane window" id="reading-pane" aria-label="Reading" aria-live="polite"></section>
		<div class="handle" id="handle" role="separator" aria-orientation="vertical" aria-label="Drag to resize the reading and the Bible" tabindex="0"></div>
		<section class="pane window" id="bible-pane" aria-label="Bible"></section>
	</div>
	<section class="pane window" id="settings-pane"></section>
</div>

<dialog id="who">
	<h2>What's your name?</h2>
	<p class="small muted">Your Bible versions from the app follow your name.</p>
	<form id="who-form" method="dialog">
		<input type="text" id="who-name" maxlength="60" autocomplete="name" placeholder="Your name">
		<div class="err" id="who-err"></div>
		<div class="who" id="who-list"></div>
		<div style="display:flex; gap:.5rem; justify-content:flex-end; margin-top:.6rem">
			<button type="button" class="btn plain" id="who-skip">Not now</button>
			<button type="submit" class="btn">Continue</button>
		</div>
	</form>
</dialog>

<dialog id="note-dlg">
	<h2 id="note-title">Highlight</h2>
	<blockquote id="note-quote"></blockquote>
	<div class="choices" id="note-colors" role="group" aria-label="Highlight colour"></div>
	<textarea id="note-text" maxlength="20000" placeholder="Your comment (optional)"></textarea>
	<div class="err" id="note-err"></div>
	<div style="display:flex; gap:.5rem; justify-content:flex-end; flex-wrap:wrap">
		<button type="button" class="btn plain" id="note-delete">Delete</button>
		<span class="spacer"></span>
		<button type="button" class="btn plain" id="note-cancel">Cancel</button>
		<button type="button" class="btn" id="note-save">Save</button>
	</div>
</dialog>
<div class="selbar" id="selbar" hidden role="toolbar" aria-label="Highlight the selected text"></div>
<div class="toast" id="toast" hidden role="status"></div>

<!-- wallpick.js -->
<script>
const $ = (id) => document.getElementById(id);
const root = document.documentElement;
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const store = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
const wide = window.matchMedia('(min-width: 960px)');
const getJson = async (url, init) => { const r = await fetch(url, init); const j = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(j.error || `HTTP ${r.status}`), { status: r.status }); return j; };
const closeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';

let entries = [], voices = { voices: [], default: null };
let listTab = store.get('read.tab', 'daily_reading') === 'lesson' ? 'lesson' : 'daily_reading';
let focus = 'list'; // on a phone, the one pane shown: list | reading | bible
let profile = (() => { try { return JSON.parse(store.get('read.profile', 'null')); } catch { return null; } })();
let bibleAudio = false; // whether this server reads Bible chapters aloud
let serverBibles = [], profileBibles = [], bible = null; // bible: the version open, loaded in full
let library = { topics: [], wallpapers: [] }, wallTopic = 'all';

// --- Labels -------------------------------------------------------------------
// Dates are written in the reader's own language; taken at noon UTC so no time zone moves them a day.
const day = (iso, opts) => iso && /^\d{4}-\d{2}-\d{2}/.test(iso) ? new Date(iso.slice(0, 10) + 'T12:00:00Z').toLocaleDateString(undefined, { timeZone: 'UTC', ...opts }) : '';
const kindOf = (e) => (e.kind === 'lesson' ? 'lesson' : 'daily_reading');
function heading(e) {
	if (kindOf(e) === 'lesson') return [e.lesson_number ? `Lesson ${e.lesson_number}` : '', day(e.entry_date, { month: 'long', day: 'numeric', year: 'numeric' })].filter(Boolean).join(' · ') || 'Lesson';
	return day(e.entry_date || e.created_at, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}
const sortKey = (e) => (e.entry_date || e.created_at || '') + '|' + (e.created_at || '') + '|' + String(e.id).padStart(9, '0');

// --- The address: which reading and which passage are open ---------------------
// "#/entry/12", "#/bible/kjv/44/8/37-38", both together on a desktop
// ("#/entry/12/bible/kjv/44/8"), or "#/settings".
function parseHash() {
	const h = location.hash;
	if (h === '#/settings') return { settings: true };
	const e = /(?:^#|\/)entry\/(\d+)/.exec(h);
	const b = /(?:^#|\/)bible\/([a-z0-9]+)(?:\/(\d+)\/(\d+)(?:\/(\d+)(?:-(\d+))?)?)?/.exec(h);
	return {
		entry: e ? Number(e[1]) : null,
		bible: b ? { version: b[1], book: b[2] != null ? Number(b[2]) : null, chapter: b[3] ? Number(b[3]) : null, verse: b[4] ? Number(b[4]) : null, verseEnd: b[5] ? Number(b[5]) : null } : null,
	};
}
function hashFor({ entry, bible: b }) {
	const parts = [];
	if (entry) parts.push(`entry/${entry}`);
	if (b) parts.push(`bible/${b.version}` + (b.book != null ? `/${b.book}/${b.chapter || 1}` + (b.verse ? `/${b.verse}` + (b.verseEnd ? `-${b.verseEnd}` : '') : '') : ''));
	return parts.length ? '#/' + parts.join('/') : '';
}
// Changes what is open. On a phone only one pane shows, so opening one replaces the other.
function go(change, newFocus) {
	const cur = parseHash();
	const next = { entry: cur.settings ? null : cur.entry, bible: cur.settings ? null : cur.bible, ...change };
	if (!wide.matches) {
		if (newFocus === 'reading') next.bible = null;
		if (newFocus === 'bible') next.entry = null;
		if (newFocus === 'list') { next.entry = null; next.bible = null; }
	}
	if (newFocus) focus = newFocus;
	if (next.bible) store.set('read.biblePos', JSON.stringify(next.bible));
	const h = hashFor(next);
	if (location.hash !== h) location.hash = h; else render();
}

// --- Look: theme, wallpaper, opacity, shade ------------------------------------
function setTheme(mode) {
	if (mode === 'auto') delete root.dataset.theme; else root.dataset.theme = mode;
	store.set('theme', mode === 'auto' ? null : mode);
}
function applyWallpaper() {
	const id = root.dataset.wallpaper;
	document.body.style.backgroundImage = id ? `url("/api/wallpapers/${encodeURIComponent(id)}")` : '';
	measureTop();
}
// bias: which part of an image wider than the window shows (0 = its left edge, 1 = its right edge).
// One chosen by hand is centred.
function setWallpaper(id, bias = null) {
	if (id) root.dataset.wallpaper = id; else delete root.dataset.wallpaper;
	store.set('read.wallpaper', id || null);
	const x = id && bias != null && bias >= 0 && bias <= 1 ? bias : null;
	store.set('read.wallBias', x == null ? null : String(x));
	if (x == null) root.style.removeProperty('--wall-x'); else root.style.setProperty('--wall-x', x);
	applyWallpaper();
}
// "A new one each time": a random wallpaper whenever the website is opened, by the rules in wallpick.js
// (the chosen topic, dark ones in the evening when asked for, a random crop of a wide image).
// read.wallRandom holds the topic ('all' or a topic id); unset means a fixed wallpaper (or none).
function pickRandomWallpaper() {
	const chosen = WallPick.choose(library, (key) => store.get(key, null), root.dataset.wallpaper || null);
	if (!chosen) return false;
	setWallpaper(chosen.id, chosen.bias);
	return true;
}
function setPercent(varName, key, pct, min) {
	const v = Math.max(min, Math.min(100, Math.round(Number(pct))));
	root.style.setProperty(varName, v / 100);
	store.set(key, String(v));
	return v;
}

// --- Profile --------------------------------------------------------------------
async function askProfile() {
	const dlg = $('who');
	$('who-err').textContent = ''; $('who-name').value = '';
	const list = $('who-list'); list.replaceChildren();
	try {
		const { profiles } = await getJson('/api/profiles');
		for (const p of profiles) {
			const b = el('button', `Continue as ${p.name}`, 'btn plain'); b.type = 'button';
			b.onclick = () => { useProfile(p); dlg.close(); };
			list.append(b);
		}
	} catch {}
	dlg.showModal(); $('who-name').focus();
}
$('who-form').onsubmit = async (ev) => {
	ev.preventDefault();
	const name = $('who-name').value.trim();
	if (!name) { $('who-err').textContent = 'Enter your name, or choose one below.'; return; }
	try { useProfile(await getJson('/api/profiles', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) })); $('who').close(); }
	catch (err) { $('who-err').textContent = err.message; }
};
$('who-skip').onclick = () => { store.set('read.askedProfile', '1'); $('who').close(); };
function useProfile(p) {
	profile = { id: p.id, name: p.name };
	store.set('read.profile', JSON.stringify(profile));
	Promise.all([loadProfileBibles(), loadNotes()]).then(render);
}
async function loadProfileBibles() {
	profileBibles = [];
	if (!profile) return;
	try { profileBibles = (await getJson(`/api/profiles/${profile.id}/bibles`)).bibles || []; }
	catch (err) {
		if (err.status === 404) {
			// Older server, or the profile was removed on the admin panel: only the latter means "ask again".
			try { const { profiles } = await getJson('/api/profiles'); if (!profiles.some((p) => p.id === profile.id)) { profile = null; store.set('read.profile', null); } } catch {}
		}
	}
}
// The versions this person has in the app, as far as this server still has them; all of the server's if none.
function availableBibles() {
	const mine = serverBibles.filter((b) => profileBibles.includes(b.id));
	return { list: mine.length ? mine : serverBibles, mine: mine.length > 0 };
}

// --- Autoplay -----------------------------------------------------------------------
// When a reading or lesson has been heard to the end, the next thing plays by itself: the latest
// unread daily reading; when all are read, the latest unread lesson; when those are read too, the
// Bible, a chapter after the other from where autoplay left it. What counts as read (heard or
// scrolled to the end) and the place in the Bible are kept in this browser, per profile. Only
// autoplay moves that place: chapters played by hand leave it alone.
const who = () => profile?.id ?? 0;
function readIds() { try { return new Set(JSON.parse(store.get(`read.done.${who()}`, '[]'))); } catch { return new Set(); } }
function markRead(id) { const ids = readIds(); if (ids.has(id)) return; ids.add(id); store.set(`read.done.${who()}`, JSON.stringify([...ids])); }
const autoplayOn = () => store.get('read.autoplay', '1') === '1';
// { book, chapter, at (seconds into it), finished, title }: the chapter autoplay played last.
function biblePlace() { try { return JSON.parse(store.get(`read.biblePlace.${who()}`, 'null')); } catch { return null; } }
function saveBiblePlace(place) { store.set(`read.biblePlace.${who()}`, place ? JSON.stringify(place) : null); }
// What render() is to start playing: { entry: id } or { bible: { version, book, chapter, at } }.
let autoStart = null;
const hasAudio = (e) => !e.deleted && Boolean((e.audio && e.audio.length) || e.has_audio);
function nextUnread(finishedId) {
	const read = readIds();
	for (const kind of ['daily_reading', 'lesson']) {
		const e = entries.filter((x) => kindOf(x) === kind && x.id !== finishedId && !read.has(x.id) && hasAudio(x)).sort((a, b) => sortKey(b).localeCompare(sortKey(a)))[0];
		if (e) return e;
	}
	return null;
}
// An unfinished chapter again, from where it stopped; after a finished one the next chapter, the next
// book's first, and after the last book the first again. counts: the chapters each book has.
function nextChapter(place, counts) {
	const first = counts.findIndex((n) => n > 0);
	if (first < 0) return null;
	const start = { book: first, chapter: 1, at: 0 };
	if (!place || !Number.isInteger(place.book) || !Number.isInteger(place.chapter) || !(place.chapter >= 1 && place.chapter <= counts[place.book])) return start;
	if (!place.finished) return { book: place.book, chapter: place.chapter, at: Math.max(0, Number(place.at) || 0) };
	if (place.chapter < counts[place.book]) return { book: place.book, chapter: place.chapter + 1, at: 0 };
	for (let b = place.book + 1; b < counts.length; b++) if (counts[b] > 0) return { book: b, chapter: 1, at: 0 };
	return start;
}
// Something was heard to the end (finishedId: the reading, or null for a chapter): open and play what follows.
async function autoplayNext(finishedId) {
	if (!autoplayOn()) return;
	const e = nextUnread(finishedId);
	if (e) { autoStart = { entry: e.id }; go({ entry: e.id }, wide.matches ? undefined : 'reading'); return; }
	const version = bibleAudio && defaultVersion();
	if (!version) return;
	let v;
	try { v = await loadVersion(version); } catch { return; }
	const step = nextChapter(biblePlace(), v.books.map((b) => b.chapters.length));
	if (!step) return;
	autoStart = { bible: { version, book: step.book, chapter: step.chapter, at: step.at } };
	go({ bible: { version, book: step.book, chapter: step.chapter } }, wide.matches ? undefined : 'bible');
}

// --- Bible ------------------------------------------------------------------------
async function loadVersion(id) {
	if (bible?.id === id) return bible;
	bible = await getJson(`/api/bibles/${encodeURIComponent(id)}`);
	store.set('read.bible', id);
	return bible;
}
function defaultVersion() {
	const { list } = availableBibles();
	return list.some((b) => b.id === store.get('read.bible')) ? store.get('read.bible') : list[0]?.id || null;
}
// A reference from an entry: book by its standard position when the version has the usual 66 books, else by name.
function bookIndexFor(ref, version) {
	if (version.books.length === 66 && ref.book_index >= 0 && ref.book_index < 66) return ref.book_index;
	const want = String(ref.book || '').toLowerCase().replace(/^psalm$/, 'psalms');
	const i = version.books.findIndex((b) => b.name.toLowerCase() === want);
	return i >= 0 ? i : null;
}
async function openReference(ref) {
	const id = defaultVersion();
	if (!id) { alert('This server has no Bible versions yet.'); return; }
	try {
		const v = await loadVersion(id);
		const b = bookIndexFor(ref, v);
		go({ bible: b == null ? { version: id, book: null } : { version: id, book: b, chapter: Math.min(ref.chapter, v.books[b].chapters.length), verse: ref.verse_start, verseEnd: ref.verse_end } }, 'bible');
	} catch { alert('Could not open the Bible.'); }
}

function renderBible(pane, pos) {
	const { list, mine } = availableBibles();
	const bibleBack = el('button', '← Back', 'bubble back narrow-only'); bibleBack.type = 'button';
	bibleBack.onclick = () => (history.length > 1 ? history.back() : go({ bible: null }, 'list'));
	pane.append(floaters(pos.book != null ? bibleBack : null, closeButton('bible')));
	const head = el('div', null, 'pane-head room' + (pos.book != null ? ' room-left-narrow' : ''));
	pane.append(head);
	if (!list.length) { pane.append(el('p', 'This server has no Bible versions yet: they are added on its admin panel.', 'empty')); return; }
	const version = pos.version && list.some((b) => b.id === pos.version) ? pos.version : defaultVersion();
	if (!bible || bible.id !== version) {
		pane.append(el('p', 'Loading the Bible…', 'empty'));
		loadVersion(version).then(render).catch(() => pane.replaceChildren(el('p', 'Could not load this version.', 'empty')));
		return;
	}
	const grow = el('div', null, 'grow choices');
	const pick = el('select'); pick.setAttribute('aria-label', 'Bible version');
	for (const b of list) { const o = el('option', b.name); o.value = b.id; pick.append(o); }
	pick.value = version;
	pick.onchange = () => go({ bible: { version: pick.value, book: pos.book, chapter: pos.chapter } }, 'bible');
	grow.append(pick);
	if (pos.book != null && bible.books[pos.book]) {
		const bookSel = el('select'); bookSel.setAttribute('aria-label', 'Book');
		bible.books.forEach((b, i) => { const o = el('option', b.name); o.value = String(i); bookSel.append(o); });
		bookSel.value = String(pos.book);
		bookSel.onchange = () => go({ bible: { version, book: Number(bookSel.value), chapter: 1 } }, 'bible');
		const chapSel = el('select'); chapSel.setAttribute('aria-label', 'Chapter');
		bible.books[pos.book].chapters.forEach((_, i) => { const o = el('option', `Chapter ${i + 1}`); o.value = String(i + 1); chapSel.append(o); });
		chapSel.value = String(Math.min(pos.chapter || 1, bible.books[pos.book].chapters.length));
		chapSel.onchange = () => go({ bible: { version, book: pos.book, chapter: Number(chapSel.value) } }, 'bible');
		const chNow = Number(chapSel.value);
		const verseSel = el('select'); verseSel.setAttribute('aria-label', 'Verse');
		const pickVerse = el('option', 'Verse'); pickVerse.value = ''; verseSel.append(pickVerse);
		bible.books[pos.book].chapters[chNow - 1].forEach((_, i) => { const o = el('option', `Verse ${i + 1}`); o.value = String(i + 1); verseSel.append(o); });
		verseSel.value = pos.verse && pos.chapter === chNow ? String(pos.verse) : '';
		verseSel.onchange = () => { if (verseSel.value) go({ bible: { version, book: pos.book, chapter: chNow, verse: Number(verseSel.value) } }, 'bible'); };
		const books = el('button', 'All books', 'chip'); books.type = 'button';
		books.onclick = () => go({ bible: { version, book: null } }, 'bible');
		grow.append(bookSel, chapSel, verseSel, books);
	}
	head.append(grow);
	if (!mine) pane.append(el('p', profile ? 'You have no versions downloaded in the app yet, so these are all the versions on the server.' : 'Choose your name (⚙ Settings) to see the versions you downloaded in the app.', 'small muted'));

	if (pos.book == null || !bible.books[pos.book]) {
		const books = el('div', null, 'books');
		bible.books.forEach((b, i) => {
			const a = el('button', b.name, 'cell'); a.type = 'button';
			a.onclick = () => go({ bible: { version, book: i, chapter: 1 } }, 'bible');
			books.append(a);
		});
		pane.append(books);
		return;
	}
	const book = bible.books[pos.book];
	const ch = Math.min(Math.max(1, pos.chapter || 1), book.chapters.length);
	const wrap = el('div', null, 'verses-wrap');
	wrap.append(el('div', bible.name, 'label'), el('h2', `${book.name} ${ch}`));
	const listen = listenCard(pane, version, pos.book, ch, () => verses);
	wrap.append(listen);
	const verses = el('div', null, 'verses');
	const target = { bible_id: version, book: pos.book, chapter: ch };
	const texts = book.chapters[ch - 1];
	let first = null;
	verses.dataset.notes = '1';
	verses._target = target;
	verses._draw = () => {
		verses.replaceChildren();
		const mine = notesFor(target);
		texts.forEach((text, i) => {
			const n = i + 1; const p = el('p');
			p.dataset.v = String(n);
			p.append(el('sup', String(n)));
			// This chapter's notes, cut to this verse (positions are verse × 10000 + offset).
			const len = text.length, lo = i * VERSE, hi = (i + 1) * VERSE;
			const local = (x) => (x < lo ? 0 : x >= hi ? len : Math.min(x - lo, len));
			const here = mine.filter((a) => !isWhole(a)).map((a) => ({ ...a, start: local(a.start), end: local(a.end) })).filter((a) => a.start < a.end);
			const ends = mine.filter((a) => !isWhole(a) && a.end >= lo && a.end < hi).map((a) => ({ ...a, end: local(a.end) }));
			appendPieces(p, text, lo, segments(len, here), markerMap(len, ends), 0, len, null);
			if (pos.verse && n >= pos.verse && n <= (pos.verseEnd || pos.verse)) { p.className = 'hit'; first ||= p; }
			verses.append(p);
		});
	};
	verses._draw();
	// A verse's number starts the reading from that verse.
	verses.classList.toggle('can-start', bibleAudio);
	if (bibleAudio) verses.addEventListener('click', (ev) => { const sup = ev.target.closest('sup'); if (sup) listen._startAt(Number(sup.parentElement.dataset.v)); });
	wrap.append(verses);
	const nav = el('div', null, 'chapnav');
	const prev = el('button', '← Previous'); prev.disabled = ch <= 1 && pos.book === 0;
	prev.onclick = () => go({ bible: ch > 1 ? { version, book: pos.book, chapter: ch - 1 } : { version, book: pos.book - 1, chapter: bible.books[pos.book - 1].chapters.length } }, 'bible');
	const next = el('button', 'Next →'); next.disabled = ch >= book.chapters.length && pos.book === bible.books.length - 1;
	next.onclick = () => go({ bible: ch < book.chapters.length ? { version, book: pos.book, chapter: ch + 1 } : { version, book: pos.book + 1, chapter: 1 } }, 'bible');
	nav.append(prev, next); wrap.append(nav);
	wrap.append(notesList(target, 'chapter'));
	pane.append(wrap);
	// To the passage: inside the pane on a desktop, the page itself on a phone.
	requestAnimationFrame(() => {
		if (!first) { pane.scrollTop = 0; return; }
		if (wide.matches) pane.scrollTop = Math.max(0, first.offsetTop - pane.offsetTop - pane.clientHeight / 3);
		else window.scrollTo(0, Math.max(0, first.getBoundingClientRect().top + window.scrollY - window.innerHeight / 3));
	});
}

// A chapter's card: listening, and the scroll control (see scrollControl). The server reads a chapter
// the first time anyone asks, which takes a moment; until it is ready it answers "making" and this
// asks again. The server also says when each verse is heard, so while the audio plays the verse being
// read is kept in the middle of the screen ("Follow"; it is not marked), and a verse's number starts
// the reading there. While nothing plays, "Auto scroll" moves the chapter up at a steady pace, as in a
// reading. On a server that does not read the Bible aloud, the card holds the auto scroll alone.
function listenCard(pane, version, book, chapter, versesBox) {
	const url = `/api/bibles/${encodeURIComponent(version)}/audio/${book}/${chapter}`;
	const box = el('div', null, 'card player');
	const button = el('button', '▶ Listen', 'follow'); button.type = 'button'; button.hidden = !bibleAudio;
	const note = el('span', null, 'small muted');
	const player = el('audio'); player.controls = true; player.preload = 'none'; player.hidden = true;
	const speedSel = el('select'); speedSel.setAttribute('aria-label', 'Speed'); speedSel.hidden = true;
	for (const s of ['0.75', '1', '1.25', '1.5', '1.75', '2']) { const o = el('option', s + '×'); o.value = s; speedSel.append(o); }
	speedSel.value = store.get('read.speed', '1');
	speedSel.onchange = () => { store.set('read.speed', speedSel.value); player.playbackRate = Number(speedSel.value); };
	player.addEventListener('play', () => { player.playbackRate = Number(speedSel.value); });

	let times = [], asking = false, loaded = false, startVerse = null;
	// Autoplay's own chapter (see autoplayNext): it records how far it got, and the next one follows it.
	const wanted = autoStart?.bible;
	const auto = Boolean(wanted && wanted.version === version && wanted.book === book && wanted.chapter === chapter);
	let autoAt = auto ? wanted.at || 0 : 0, lastSaved = autoAt;
	if (auto) autoStart = null;
	const place = (at, finished) => saveBiblePlace({ book, chapter, at, finished, title: `${bible?.books[book]?.name || ''} ${chapter}`.trim() });
	if (auto) {
		place(autoAt, false);
		player.addEventListener('timeupdate', () => { if (Math.abs(player.currentTime - lastSaved) >= 5) { lastSaved = player.currentTime; place(lastSaved, false); } });
		player.addEventListener('pause', () => { if (!player.ended) place(player.currentTime, false); });
		player.addEventListener('ended', () => { place(0, true); if (box.isConnected) autoplayNext(null); });
	}
	// Where the words being read are on the screen: in the verse being read, as far down it as the voice is through it.
	const spokenY = () => {
		if (!loaded || !times.length) return null;
		const t = player.currentTime;
		let now = times[0];
		for (const x of times) { if (x.start <= t + 0.05) now = x; else break; }
		const p = versesBox()?.querySelector(`p[data-v="${now.verse}"]`);
		if (!p) return null;
		const r = p.getBoundingClientRect();
		const through = now.end > now.start ? Math.max(0, Math.min(1, (t - now.start) / (now.end - now.start))) : 0;
		const line = Math.min(r.height, parseFloat(getComputedStyle(p).lineHeight) || 24);
		return r.top + line / 2 + (r.height - line) * through;
	};
	// Following is on for the Bible until it is switched off here.
	const scroll = scrollControl(pane, player, { spokenY, followKey: 'read.bibleFollow', followDefault: '1', bothWays: true });
	// As in a reading, the speed is only shown while the audio plays.
	const showSpeed = () => { speedSel.hidden = !loaded || player.paused || player.ended; };
	for (const ev of ['play', 'pause', 'ended']) player.addEventListener(ev, showSpeed);

	const begin = () => {
		if (startVerse != null) { const t = times.find((x) => x.verse === startVerse); if (t) player.currentTime = t.start; startVerse = null; }
		// A browser may refuse to start audio by itself: the player is there to press.
		player.play().catch(() => { if (auto) note.textContent = 'Press play to carry on listening.'; });
	};
	const ask = async () => {
		if (asking) return;
		asking = true; button.disabled = true; note.textContent = 'Preparing the audio…';
		try {
			for (let tries = 0; box.isConnected && tries < 400; tries++) {
				const r = await fetch(url + '/verses');
				if (r.status === 202) { await new Promise((res) => setTimeout(res, 3000)); continue; }
				const j = await r.json().catch(() => ({}));
				if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
				times = Array.isArray(j.verses) ? j.verses : [];
				// A chapter autoplay stopped in is taken up again at the verse it was in.
				if (autoAt > 0 && startVerse == null) { startVerse = times.filter((x) => x.start <= autoAt).pop()?.verse ?? null; autoAt = 0; }
				note.textContent = ''; button.hidden = true; player.hidden = false;
				loaded = true;
				// It is about to be played: without this, starting at a verse would wait for a length that is never fetched.
				player.preload = 'auto';
				player.src = url;
				if (startVerse != null) player.addEventListener('loadedmetadata', begin, { once: true }); else begin();
				return;
			}
			if (box.isConnected) throw new Error('This is taking too long; try again in a while.');
		} catch (err) {
			note.textContent = `Could not get the audio: ${err.message}`; button.textContent = '▶ Try again';
		} finally { asking = false; button.disabled = false; }
	};
	button.onclick = ask;
	// A verse's number: read from there, and follow it.
	box._startAt = (verse) => {
		startVerse = verse;
		if (loaded) begin(); else ask();
		scroll._hold();
	};
	box.append(button, note, player, scroll, speedSel);
	// Once the card is on the page (asking stops when it is not).
	if (auto) setTimeout(ask, 0);
	return box;
}

// --- Highlights and comments ------------------------------------------------------
// The same ones as in the app, per profile, kept on the server. A reading's are at
// character offsets in its body; a Bible chapter's at verse index × 10000 + offset in
// that verse. "Whole" notes (start = end = 0) are on the whole reading or chapter.
// The app wins conflicts: the server refuses a change here to something the app
// changed meanwhile and sends the app's version, which is then shown.
const COLORS = ['yellow', 'green', 'blue', 'pink'];
const VERSE = 10000;
let notes = [];
let toastTimer = null;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 5000); }
function uuid() {
	// crypto.randomUUID needs https; this works on a plain-http LAN address too.
	const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
	const h = [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
	return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
/** Loads this profile's notes; true when they changed. */
async function loadNotes() {
	const before = JSON.stringify(notes);
	if (!profile) notes = [];
	else {
		try { notes = ((await getJson(`/api/profiles/${profile.id}/annotations`)).annotations || []).filter((a) => !a.deleted); }
		catch { return false; }
	}
	return JSON.stringify(notes) !== before;
}
const isWhole = (a) => a.start === 0 && a.end === 0;
const newest = (list) => list.reduce((best, a) => (!best || (a.updated_at || '') >= (best.updated_at || '') ? a : best), null);
function notesFor(target) {
	return notes.filter((a) => target.bible_id ? a.bible_id === target.bible_id && a.book === target.book && a.chapter === target.chapter : !a.bible_id && a.entry_id === target.entry_id);
}
function replaceNote(a) { notes = notes.filter((n) => n.id !== a.id); if (a && !a.deleted) notes.push(a); }
async function saveNote(a) {
	if (!profile) { askProfile(); throw new Error('Choose your name first.'); }
	const known = notes.find((n) => n.id === a.id);
	const body = { entry_id: a.bible_id ? 0 : a.entry_id, start: a.start, end: a.end, color: a.color, comment: a.comment || '', deleted: Boolean(a.deleted), source: 'web' };
	if (known) body.base_updated_at = known.updated_at;
	if (a.bible_id) Object.assign(body, { bible_id: a.bible_id, book: a.book, chapter: a.chapter });
	const r = await fetch(`/api/profiles/${profile.id}/annotations/${encodeURIComponent(a.id)}`, { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
	const j = await r.json().catch(() => ({}));
	if (r.status === 409 && j.annotation) { replaceNote(j.annotation); redrawNotes(); toast(j.error || 'Changed in the app meanwhile; showing the app\'s version.'); return; }
	if (!r.ok) throw new Error(j.error || `Could not save (HTTP ${r.status}).`);
	replaceNote(j); redrawNotes();
}
/** Redraws every highlighted text and notes list on the page, leaving the rest (and the audio) alone. */
function redrawNotes() { for (const box of document.querySelectorAll('[data-notes], [data-notelist]')) box._draw?.(); }

/** [from, to) pieces covering 0..len: the colour shown (newest coloured note), the note a click opens (newest), the link. */
function segments(len, list, links = []) {
	const live = list.filter((a) => !isWhole(a)).map((a) => ({ a, s: Math.max(0, Math.min(len, a.start)), e: Math.max(0, Math.min(len, a.end)) })).filter((x) => x.s < x.e);
	const cuts = new Set([0, len]);
	for (const x of live) { cuts.add(x.s); cuts.add(x.e); }
	for (const l of links) { if (l.start >= 0 && l.end <= len) { cuts.add(l.start); cuts.add(l.end); } }
	const pts = [...cuts].sort((x, y) => x - y);
	const out = [];
	for (let i = 0; i < pts.length - 1; i++) {
		const from = pts[i], to = pts[i + 1];
		const cover = live.filter((x) => x.s <= from && x.e >= to).map((x) => x.a);
		out.push({ from, to, color: newest(cover.filter((a) => COLORS.includes(a.color)))?.color || null, note: newest(cover)?.id || null, link: links.find((l) => from >= l.start && to <= l.end) || null });
	}
	return out;
}
/** Where comment markers go: end offset → note id (the newest commented note ending there). */
function markerMap(len, list) {
	const m = new Map();
	for (const a of list) {
		if (isWhole(a) || !a.comment?.trim()) continue;
		const e = Math.max(0, Math.min(len, a.end));
		const cur = m.get(e);
		if (!cur || (a.updated_at || '') >= (cur.updated_at || '')) m.set(e, a);
	}
	return m;
}
function marker(note) {
	const b = el('button', '💬', 'marker'); b.type = 'button'; b.title = 'Comment'; b.setAttribute('aria-label', 'Open the comment');
	b.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); openNote(note); };
	return b;
}
/** Appends text[from, to) of a body (positions base + i) as styled spans, with links and markers. */
function appendPieces(parent, text, base, segs, markers, from, to, onLink) {
	for (const g of segs) {
		const s = Math.max(g.from, from), t = Math.min(g.to, to);
		if (s >= t) continue;
		const span = el('span', text.slice(s, t));
		span.dataset.s = String(base + s); span.dataset.e = String(base + t);
		if (g.color) span.className = 'hl-' + g.color;
		if (g.note) span.dataset.note = g.note;
		if (g.link && onLink) {
			const a = el('a'); a.href = '#'; a.onclick = (ev) => { ev.preventDefault(); onLink(g.link); };
			a.append(span); parent.append(a);
		} else parent.append(span);
		const m = markers.get(t);
		if (m) parent.append(marker(m));
	}
}

// Selection → position. A point inside one of the spans is its start + the offset;
// anywhere else (between paragraphs, on a verse number) counts as the next span's start.
function posAt(box, node, offset) {
	if (node.nodeType === 3) {
		const span = node.parentElement?.closest('[data-s]');
		if (span && box.contains(span)) return Number(span.dataset.s) + Math.min(offset, node.length);
	}
	const point = document.createRange();
	try { point.setStart(node, offset); } catch { return null; }
	const spans = box.querySelectorAll('[data-s]');
	for (const sp of spans) if (point.comparePoint(sp, 0) >= 0) return Number(sp.dataset.s);
	return spans.length ? Number(spans[spans.length - 1].dataset.e) : null;
}
function selectionIn() {
	const sel = getSelection();
	if (!sel || !sel.rangeCount || sel.isCollapsed) return null;
	const r = sel.getRangeAt(0);
	const host = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
	const box = host?.closest('[data-notes]');
	if (!box) return null;
	let start = posAt(box, r.startContainer, r.startOffset), end = posAt(box, r.endContainer, r.endOffset);
	if (start == null || end == null || end <= start) return null;
	return { box, start, end, rect: r.getBoundingClientRect() };
}
// The bar of colours over a selection. Pressing it must not clear the selection first.
const selbar = $('selbar');
selbar.addEventListener('pointerdown', (ev) => ev.preventDefault());
let selTimer = null;
document.addEventListener('selectionchange', () => { clearTimeout(selTimer); selTimer = setTimeout(showSelbar, 200); });
function showSelbar() {
	const cur = selectionIn();
	if (!cur || $('note-dlg').open) { selbar.hidden = true; return; }
	selbar.replaceChildren();
	if (!profile) {
		const who = el('button', 'Choose your name to highlight', 'chip'); who.type = 'button';
		who.onclick = () => { selbar.hidden = true; askProfile(); };
		selbar.append(who);
	} else {
		for (const c of COLORS) {
			const b = el('button', null, 'swatch hl-' + c); b.type = 'button'; b.title = `Highlight ${c}`; b.setAttribute('aria-label', b.title);
			b.onclick = () => act(() => saveNote({ id: uuid(), ...cur.box._target, start: cur.start, end: cur.end, color: c, comment: '' }));
			selbar.append(b);
		}
		const c = el('button', '💬 Comment', 'chip'); c.type = 'button';
		c.onclick = () => openNote({ id: uuid(), ...cur.box._target, start: cur.start, end: cur.end, color: 'none', comment: '' }, true);
		selbar.append(c);
	}
	selbar.hidden = false;
	// Above the selection; below it on touch screens, where the system's own menu sits above.
	const touch = matchMedia('(pointer: coarse)').matches;
	const w = selbar.offsetWidth, h = selbar.offsetHeight;
	let top = touch ? cur.rect.bottom + 12 : cur.rect.top - h - 10;
	if (top < 8) top = cur.rect.bottom + 12;
	if (top + h > innerHeight - 8) top = Math.max(8, cur.rect.top - h - 10);
	selbar.style.top = `${top}px`;
	selbar.style.left = `${Math.max(8, Math.min(innerWidth - w - 8, cur.rect.left + cur.rect.width / 2 - w / 2))}px`;
}
async function act(fn) {
	try { await fn(); getSelection()?.removeAllRanges(); selbar.hidden = true; }
	catch (err) { toast(err.message); }
}
// A click on highlighted text (not a link, not while selecting) opens that note.
document.addEventListener('click', (ev) => {
	const span = ev.target.closest?.('[data-notes] [data-note]');
	if (!span || ev.target.closest('a') || !getSelection().isCollapsed) return;
	const n = notes.find((a) => a.id === span.dataset.note);
	if (n) openNote(n);
});

function quoteOf(a) {
	if (a.bible_id) {
		const verses = bible?.id === a.bible_id ? bible.books[a.book]?.chapters[a.chapter - 1] : null;
		if (!verses) return '';
		const out = [];
		for (let v = Math.floor(a.start / VERSE); v <= Math.floor(a.end / VERSE) && v < verses.length; v++) {
			const t = verses[v] || '';
			const s = v === Math.floor(a.start / VERSE) ? a.start % VERSE : 0, e = v === Math.floor(a.end / VERSE) ? a.end % VERSE : t.length;
			if (e > s) out.push(t.slice(s, e));
		}
		return out.join(' ');
	}
	const e = entries.find((x) => x.id === a.entry_id);
	return e?.body ? e.body.slice(a.start, a.end) : '';
}

// The note window: colour, comment, delete.
let editing = null;
function openNote(a, isNew = false) {
	selbar.hidden = true;
	editing = { ...a, isNew };
	const whole = isWhole(a);
	$('note-title').textContent = whole ? (a.bible_id ? 'Note on this chapter' : 'Note on this reading') : isNew ? 'Comment' : 'Highlight';
	const q = whole ? '' : quoteOf(a);
	$('note-quote').textContent = q.length > 400 ? q.slice(0, 400) + '…' : q;
	$('note-quote').hidden = !q;
	const colors = $('note-colors'); colors.replaceChildren(); colors.hidden = whole;
	for (const c of ['none', ...COLORS]) {
		const b = el('button', null, 'swatch ' + (c === 'none' ? 'none' : 'hl-' + c)); b.type = 'button';
		b.title = c === 'none' ? 'No colour' : c; b.setAttribute('aria-label', b.title);
		b.setAttribute('aria-pressed', String(editing.color === c));
		b.onclick = () => { editing.color = c; for (const x of colors.children) x.setAttribute('aria-pressed', String(x === b)); };
		colors.append(b);
	}
	$('note-text').value = a.comment || '';
	$('note-err').textContent = '';
	$('note-delete').hidden = isNew;
	$('note-dlg').showModal();
	$('note-text').focus();
}
$('note-cancel').onclick = () => $('note-dlg').close();
$('note-save').onclick = async () => {
	const comment = $('note-text').value;
	// Nothing left (no colour, no comment) is the same as deleting it.
	const empty = editing.color === 'none' && !comment.trim();
	if (empty && editing.isNew) { $('note-dlg').close(); return; }
	try { await saveNote({ ...editing, comment, deleted: empty }); $('note-dlg').close(); getSelection()?.removeAllRanges(); }
	catch (err) { $('note-err').textContent = err.message; }
};
$('note-delete').onclick = async () => {
	try { await saveNote({ ...editing, deleted: true }); $('note-dlg').close(); }
	catch (err) { $('note-err').textContent = err.message; }
};

/** The list under a reading or chapter: its whole note, then each highlight in order. */
function notesList(target, label) {
	const box = el('div', null, 'notes');
	box.dataset.notelist = '1';
	box._draw = () => {
		box.replaceChildren();
		if (!profile) return;
		const mine = notesFor(target);
		const whole = newest(mine.filter(isWhole));
		const parts = mine.filter((a) => !isWhole(a)).sort((a, b) => a.start - b.start || a.end - b.end);
		box.append(el('h3', 'Your notes'));
		const w = el('button', null, 'note item'); w.type = 'button';
		w.append(el('span', null, 'dot'));
		const wt = el('div'); wt.append(el('div', whole?.comment?.trim() ? whole.comment : `Add a note on this ${label}…`, whole?.comment?.trim() ? 'what' : 'muted'));
		w.append(wt);
		w.onclick = () => openNote(whole || { id: uuid(), ...target, start: 0, end: 0, color: 'none', comment: '' }, !whole);
		box.append(w);
		for (const a of parts) {
			const b = el('button', null, 'note item'); b.type = 'button';
			const dot = el('span', null, 'dot' + (COLORS.includes(a.color) ? ' hl-' + a.color : ''));
			const t = el('div'); t.append(el('q', quoteOf(a)));
			if (a.comment?.trim()) t.append(el('div', a.comment, 'what'));
			b.append(dot, t); b.onclick = () => openNote(a);
			box.append(b);
		}
		if (!parts.length) box.append(el('p', 'Select text to highlight it or add a comment.', 'small muted'));
	};
	box._draw();
	return box;
}

// Changes made in the app show up here: on returning to the page and every half minute.
async function refreshNotes() {
	if (document.hidden || $('note-dlg').open || selectionIn()) return;
	if (await loadNotes()) redrawNotes();
}
document.addEventListener('visibilitychange', refreshNotes);
setInterval(refreshNotes, 30000);

// --- Readings -------------------------------------------------------------------
function closeButton(which) {
	const b = el('button', null, 'icon close bubble'); b.type = 'button';
	b.innerHTML = closeIcon; b.title = which === 'bible' ? 'Close the Bible' : 'Close the reading'; b.setAttribute('aria-label', b.title);
	b.onclick = () => go(which === 'bible' ? { bible: null } : { entry: null });
	return b;
}

// A sticky, zero-height row over a pane's text holding its back (phones) and close (desktop) bubbles.
function floaters(left, right) {
	const row = el('div', null, 'floaters');
	row.append(left || el('span'), right || el('span'));
	return row;
}

function renderList(pane, currentId) {
	const list = entries.filter((e) => kindOf(e) === listTab).sort((a, b) => sortKey(b).localeCompare(sortKey(a)));
	if (!list.length) { pane.append(el('p', listTab === 'lesson' ? 'No lessons yet.' : 'No daily readings yet.', 'empty')); return; }
	for (const e of list) {
		const a = el('a', null, 'item'); a.href = hashFor({ entry: e.id, bible: wide.matches ? parseHash().bible : null });
		a.onclick = (ev) => { ev.preventDefault(); go({ entry: e.id }, 'reading'); };
		if (e.id === currentId) a.setAttribute('aria-current', 'true');
		const label = el('div', heading(e), 'label');
		if (kindOf(e) === 'daily_reading' && e.lesson_number) label.append(el('span', `Lesson ${e.lesson_number}`, 'pill'));
		if (e.archived) label.append(el('span', 'Archived', 'pill'));
		a.append(label, el('div', e.title, 'title'));
		if (e.summary) a.append(el('div', e.summary, 'summary'));
		pane.append(a);
	}
}

// The body as paragraphs, with each verse reference the server found turned into a link,
// and this person's highlights and comment markers.
function bodyParagraphs(e) {
	const out = [];
	const len = e.body.length;
	const refs = (e.references || []).filter((r) => r.start >= 0 && r.end <= len && r.start < r.end).sort((a, b) => a.start - b.start);
	const mine = notesFor({ entry_id: e.id });
	const segs = segments(len, mine, refs);
	const markers = markerMap(len, mine);
	const re = /\n{2,}/g; let start = 0, m;
	const parts = [];
	while ((m = re.exec(e.body))) { parts.push([start, m.index]); start = m.index + m[0].length; }
	parts.push([start, len]);
	const shown = parts.filter(([s, t]) => e.body.slice(s, t).trim());
	shown.forEach(([s, t], i) => {
		const text = e.body.slice(s, t);
		const p = el('p', null, text.trim().length < 40 && !/[.!?”"]$/.test(text.trim()) ? 'head' : '');
		appendPieces(p, e.body, 0, segs, markers, s, t, openReference);
		// A comment ending in the gap before the next paragraph is shown at the end of this one.
		const gapEnd = i + 1 < shown.length ? shown[i + 1][0] : len + 1;
		for (const [at, note] of markers) if (at > t && at < gapEnd) p.append(marker(note));
		out.push(p);
	});
	return out;
}

function renderEntry(pane, e) {
	const back = el('button', '← Back', 'bubble back narrow-only'); back.type = 'button'; back.onclick = () => go({ entry: null }, 'list');
	const art = el('article');
	art.classList.add('below-floaters');
	art.append(el('div', heading(e), 'label'), el('h2', e.title));
	if (e.scripture) art.append(el('div', e.scripture, 'muted'));
	if (e.summary) { const s = el('div', null, 'card'); s.append(el('div', 'Summary', 'label'), el('div', e.summary)); art.append(s); }
	const audio = (e.audio && e.audio.length) ? e.audio : e.has_audio ? [{ voice: '' }] : [];
	if (audio.length) {
		const box = el('div', null, 'card player');
		const player = el('audio'); player.controls = true; player.preload = 'none';
		const voiceSel = el('select'); voiceSel.setAttribute('aria-label', 'Voice');
		const nameOf = (id) => voices.voices.find((v) => v.id === id)?.name || id || 'Default voice';
		for (const a of audio) { const o = el('option', nameOf(a.voice)); o.value = a.voice; voiceSel.append(o); }
		// A lesson's premium voice comes first; otherwise the voice chosen here before, then the server's default.
		const preferred = store.get('read.voice', voices.default || '');
		const has = (v) => v && audio.some((a) => a.voice === v);
		voiceSel.value = has(e.preferred_voice) ? e.preferred_voice : has(preferred) ? preferred : has(voices.default) ? voices.default : audio[0].voice;
		const speedSel = el('select'); speedSel.setAttribute('aria-label', 'Speed');
		for (const s of ['0.75', '1', '1.25', '1.5', '1.75', '2']) { const o = el('option', s + '×'); o.value = s; speedSel.append(o); }
		speedSel.value = store.get('read.speed', '1');
		const load = (keepTime) => {
			const t = player.currentTime, playing = !player.paused;
			player.src = `/api/entries/${e.id}/audio` + (voiceSel.value ? `?voice=${encodeURIComponent(voiceSel.value)}` : '');
			player.playbackRate = Number(speedSel.value);
			if (keepTime) player.addEventListener('loadedmetadata', () => { player.currentTime = t; if (playing) player.play().catch(() => {}); }, { once: true });
		};
		voiceSel.onchange = () => { store.set('read.voice', voiceSel.value); load(true); };
		speedSel.onchange = () => { store.set('read.speed', speedSel.value); player.playbackRate = Number(speedSel.value); };
		player.addEventListener('play', () => { player.playbackRate = Number(speedSel.value); });
		load(false);
		// Heard to the end: read, and the next unread one (or the Bible) follows.
		player.addEventListener('ended', () => { markRead(e.id); if (box.isConnected) autoplayNext(e.id); });
		if (autoStart?.entry === e.id) {
			autoStart = null;
			// A browser may refuse to start audio by itself: the player is there to press.
			player.play().catch(() => toast('Press play to carry on listening.'));
		}
		box.append(player);
		if (audio.length > 1) box.append(voiceSel);
		// There are no word timings for a reading, so the place is worked out from how far through the audio it is.
		const spokenY = () => {
			const d = player.duration;
			if (!d || !Number.isFinite(d) || !e.body) return null;
			const intro = e.speech_offset || 0;
			const at = Math.max(0, Math.min(e.body.length, (player.currentTime / d) * (intro + e.body.length) - intro));
			for (const sp of pane.querySelectorAll('.body [data-s]')) {
				if (at > Number(sp.dataset.e) || !sp.firstChild) continue;
				const r = document.createRange();
				const off = Math.max(0, Math.min(sp.firstChild.length, Math.round(at - Number(sp.dataset.s))));
				r.setStart(sp.firstChild, off); r.setEnd(sp.firstChild, off);
				const rect = r.getClientRects()[0] || sp.getBoundingClientRect();
				return rect.top + rect.height / 2;
			}
			return null;
		};
		box.append(scrollControl(pane, player, { spokenY }), speedSel);
		// The speed is only shown while the audio plays.
		const showSpeed = () => { speedSel.hidden = player.paused || player.ended; };
		for (const ev of ['play', 'pause', 'ended']) player.addEventListener(ev, showSpeed);
		showSpeed();
		art.append(box);
	} else if (e.body) {
		// No audio: only the auto scroll.
		const box = el('div', null, 'card player');
		box.append(scrollControl(pane, null));
		art.append(box);
	}
	const body = el('div', null, 'body');
	if (e.body) {
		body.dataset.notes = '1';
		body._target = { entry_id: e.id };
		body._draw = () => body.replaceChildren(...bodyParagraphs(e));
		body._draw();
	} else if (e.archived) body.append(el('p', 'Archived on the server: the full text is no longer available here.', 'muted'));
	art.append(body);
	if (e.body && 'IntersectionObserver' in window) {
		// Scrolled to the end of the text: read.
		const end = el('div');
		const seen = new IntersectionObserver((xs) => { if (xs.some((x) => x.isIntersecting)) { markRead(e.id); seen.disconnect(); } });
		art.append(end); seen.observe(end);
	}
	if (e.body) art.append(notesList({ entry_id: e.id }, 'reading'));
	pane.append(floaters(back, closeButton('reading')), art);
	pane.scrollTop = 0;
}

// The scroll control of a reading and of a Bible chapter, between the voice and the speed. While the
// audio plays it is "Follow": the text glides to keep the words being read in the middle of the
// screen (spokenY says where they are on the screen now). While nothing plays it is "Auto scroll",
// with − and + for its pace. Scrolling by hand lets go; the button takes hold again. The screen is
// kept awake meanwhile.
//   followKey, followDefault  where the choice to follow is remembered, and what it is until made
//   bothWays                  also glide back up (a chapter can be started from any verse); a reading
//                             only moves down, once the voice has read as far as the middle
const AUTO_SPEEDS = [8, 12, 16, 22, 30, 40, 55, 75]; // pixels a second
function scrollControl(pane, player, { spokenY = () => null, followKey = 'read.follow', followDefault = '0', bothWays = false } = {}) {
	const wrap = el('span', null, 'scrollctl');
	const slower = el('button', '−', 'follow step'); slower.type = 'button'; slower.title = 'Slower'; slower.setAttribute('aria-label', 'Scroll slower');
	const button = el('button', null, 'follow'); button.type = 'button';
	const faster = el('button', '+', 'follow step'); faster.type = 'button'; faster.title = 'Faster'; faster.setAttribute('aria-label', 'Scroll faster');
	wrap.append(slower, button, faster);

	const playing = () => Boolean(player) && !player.paused && !player.ended;
	let follow = store.get(followKey, followDefault) === '1'; // holding on to the voice
	let auto = false; // scrolling at a steady pace
	let speed = Math.max(0, Math.min(AUTO_SPEEDS.length - 1, Number(store.get('read.autoSpeed', '3')) || 0));
	let target = 0, carry = 0, last = 0, lastLook = 0, frame = 0, lock = null;

	const active = () => (playing() ? follow : auto);
	const show = () => {
		const p = playing();
		button.textContent = p ? 'Follow' : 'Auto scroll';
		button.title = p ? 'Scroll along with the voice' : 'Scroll the text at a steady pace';
		button.setAttribute('aria-pressed', String(active()));
		slower.hidden = faster.hidden = p;
		slower.disabled = speed <= 0; faster.disabled = speed >= AUTO_SPEEDS.length - 1;
		awake();
	};
	// Keeps the screen on while it scrolls (browsers only allow this on https or localhost).
	const awake = () => {
		const want = active() && !document.hidden && button.isConnected;
		if (want && !lock && navigator.wakeLock) navigator.wakeLock.request('screen').then((l) => { lock = l; l.addEventListener('release', () => { if (lock === l) lock = null; }); if (!active()) awake(); }).catch(() => {});
		else if (!want && lock) { lock.release().catch(() => {}); lock = null; }
	};
	// The pane scrolls on a desktop; the page on a phone.
	const scroller = () => (wide.matches ? pane : document.scrollingElement);
	const view = () => (wide.matches ? pane.getBoundingClientRect() : { top: 0, height: innerHeight });
	// One step each frame: whole pixels now, the fraction carried to the next frame, so it glides.
	const move = (px) => {
		carry += px;
		const whole = Math.trunc(carry);
		if (!whole) return;
		carry -= whole;
		const sc = scroller();
		const before = sc.scrollTop;
		sc.scrollTop = before + whole;
		return sc.scrollTop !== before;
	};
	const tick = (now) => {
		frame = 0;
		if (!button.isConnected) { stop(); return; }
		const dt = Math.min(0.1, last ? (now - last) / 1000 : 0);
		last = now;
		if (playing()) {
			if (follow) {
				// Where the voice is, looked up a few times a second; the distance to it closes smoothly.
				if (now - lastLook > 250) {
					lastLook = now;
					const y = spokenY();
					const v = view();
					target = y == null ? 0 : y - (v.top + v.height / 2);
					if (!bothWays) target = Math.max(0, target);
				}
				if (Math.abs(target) > 0.5) {
					const far = Math.abs(target);
					const step = Math.sign(target) * Math.min(far, Math.max(far * 2.5, 12) * dt);
					target -= step;
					move(step);
				}
			}
		} else if (auto) {
			const sc = scroller();
			if (move(AUTO_SPEEDS[speed] * dt) === false || sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 1) { auto = false; show(); }
		}
		if (active()) frame = requestAnimationFrame(tick);
	};
	const run = () => { show(); if (active() && !frame) { last = 0; lastLook = 0; carry = 0; frame = requestAnimationFrame(tick); } };

	// A wheel, touch, key or scrollbar drag by the reader lets go (the scrolling this does itself is not theirs).
	const letGo = () => { if (!button.isConnected || !active()) return; if (playing()) follow = false; else auto = false; show(); };
	const onKey = (ev) => { if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '].includes(ev.key) && !ev.target.closest?.('input, textarea, select, button, audio')) letGo(); };
	const onDown = (ev) => { if (ev.target === pane || ev.target === document.documentElement) letGo(); };
	const onVisible = () => awake();
	const bound = wide.matches ? pane : window;
	bound.addEventListener('wheel', letGo, { passive: true });
	bound.addEventListener('touchmove', letGo, { passive: true });
	bound.addEventListener('mousedown', onDown);
	window.addEventListener('keydown', onKey);
	document.addEventListener('visibilitychange', onVisible);
	function stop() {
		bound.removeEventListener('wheel', letGo); bound.removeEventListener('touchmove', letGo); bound.removeEventListener('mousedown', onDown);
		window.removeEventListener('keydown', onKey); document.removeEventListener('visibilitychange', onVisible);
		clearInterval(watch);
		if (lock) { lock.release().catch(() => {}); lock = null; }
	}
	// The reading was closed or redrawn: tidy up.
	const watch = setInterval(() => { if (!button.isConnected) stop(); }, 2000);

	button.onclick = () => {
		if (playing()) { follow = !follow; store.set(followKey, follow ? '1' : '0'); } else auto = !auto;
		run();
	};
	// Takes hold of the voice again without the button (a chapter started from one of its verses).
	wrap._hold = () => { follow = true; auto = false; run(); };
	const setSpeed = (n) => { speed = Math.max(0, Math.min(AUTO_SPEEDS.length - 1, n)); store.set('read.autoSpeed', String(speed)); show(); };
	slower.onclick = () => setSpeed(speed - 1);
	faster.onclick = () => setSpeed(speed + 1);
	if (player) {
		// Starting the audio turns auto scroll into following; when it stops, the scrolling stops.
		player.addEventListener('play', () => { if (auto || store.get(followKey, followDefault) === '1') follow = true; auto = false; run(); });
		for (const ev of ['pause', 'ended']) player.addEventListener(ev, () => show());
	}
	show();
	return wrap;
}

// --- Settings page ----------------------------------------------------------------
function renderSettings(pane) {
	const s = el('div', null, 'settings');
	const back = el('a', '← Back', 'bubble back'); back.href = '#';
	s.append(back, el('h2', 'Settings'));

	s.append(el('h3', 'Profile'));
	const prof = el('div', null, 'choices');
	prof.append(el('span', profile ? `You are reading as ${profile.name}.` : 'No name chosen yet.', 'muted'));
	const sw = el('button', profile ? 'Switch' : 'Choose your name', 'chip'); sw.type = 'button'; sw.onclick = () => askProfile();
	prof.append(sw); s.append(prof);

	s.append(el('h3', 'Autoplay'));
	const auto = el('div', null, 'choices');
	for (const [value, label] of [['1', 'On'], ['0', 'Off']]) {
		const b = el('button', label, 'chip'); b.type = 'button';
		b.setAttribute('aria-pressed', String(autoplayOn() === (value === '1')));
		b.onclick = () => { store.set('read.autoplay', value); render(); };
		auto.append(b);
	}
	s.append(auto, el('p', 'When a reading or lesson has been heard to the end, the latest unread daily reading plays, then the latest unread lesson, then the Bible from where autoplay left it. What you have read, and that place, are kept in this browser.', 'small muted'));
	const place = biblePlace();
	if (place) {
		const row = el('div', null, 'choices');
		row.append(el('span', `In the Bible, autoplay ${place.finished ? 'has read' : 'is in'} ${place.title || `book ${place.book + 1}, chapter ${place.chapter}`}.`, 'muted'));
		const over = el('button', 'Start over', 'chip'); over.type = 'button'; over.onclick = () => { saveBiblePlace(null); render(); };
		row.append(over); s.append(row);
	}

	s.append(el('h3', 'Theme'));
	const themes = el('div', null, 'choices');
	for (const [mode, label] of [['auto', 'System'], ['light', 'Light'], ['dark', 'Dark']]) {
		const b = el('button', label, 'chip'); b.type = 'button';
		b.setAttribute('aria-pressed', String((root.dataset.theme || 'auto') === mode));
		b.onclick = () => { setTheme(mode); render(); };
		themes.append(b);
	}
	s.append(themes);

	s.append(el('h3', 'Wallpaper'));
	s.append(el('p', library.wallpapers.length ? 'Wallpapers from this server (from wallhaven.cc). Your choice is kept in this browser.' : 'This server has no wallpapers yet: they are added on its admin panel.', 'small muted'));
	const randomTopic = store.get('read.wallRandom', null);
	const randomOn = Boolean(randomTopic);
	const chip = (label, pressed, onclick) => { const b = el('button', label, 'chip'); b.type = 'button'; b.setAttribute('aria-pressed', String(pressed)); b.onclick = onclick; return b; };
	if (library.wallpapers.length) {
		// As in the app: keep the wallpaper, or a new one on each visit (from a topic, darker in the evening).
		const each = el('div', null, 'choices');
		each.append(el('span', 'Each time the website is opened:', 'muted'));
		each.append(chip('Keep my wallpaper', !randomOn, () => { store.set('read.wallRandom', null); render(); }));
		each.append(chip('A new wallpaper each time', randomOn, () => { if (!randomOn) { store.set('read.wallRandom', 'all'); pickRandomWallpaper(); } render(); }));
		s.append(each);
		if (randomOn) {
			const known = randomTopic === 'all' || library.topics.some((t) => t.id === randomTopic);
			const from = el('div', null, 'choices'); from.style.marginTop = '.5rem';
			from.append(el('span', 'From', 'muted'));
			for (const t of [{ id: 'all', name: 'All topics' }, ...library.topics]) {
				from.append(chip(t.name, t.id === randomTopic || (t.id === 'all' && !known), () => { store.set('read.wallRandom', t.id); pickRandomWallpaper(); render(); }));
			}
			s.append(from);
			const p = WallPick.prefs((key) => store.get(key, null));
			const clock = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
			const dark = el('div', null, 'choices'); dark.style.marginTop = '.5rem';
			dark.append(chip('Prefer dark wallpapers in the evening', p.dark, () => { store.set('read.wallDark', p.dark ? null : '1'); if (!p.dark) pickRandomWallpaper(); render(); }));
			const time = (label, key, value) => {
				const input = el('input'); input.type = 'time'; input.value = clock(value); input.disabled = !p.dark; input.setAttribute('aria-label', label);
				input.onchange = () => { if (WallPick.minutes(input.value) != null) store.set(key, input.value); };
				return input;
			};
			dark.append(el('span', 'from', 'muted'), time('Dark wallpapers from', 'read.wallDarkFrom', p.from), el('span', 'until', 'muted'), time('Dark wallpapers until', 'read.wallDarkUntil', p.until));
			s.append(dark);
			s.append(el('p', 'A new wallpaper is chosen each time the website is opened, never the same one twice in a row; of a picture wider than the window, a different part each time. Choose one below to keep it instead.', 'small muted'));
		}
	}
	const chips = el('div', null, 'choices'); chips.style.marginTop = '.8rem';
	const all = [{ id: 'all', name: 'All', count: library.wallpapers.length }, ...library.topics];
	if (!all.some((t) => t.id === wallTopic)) wallTopic = 'all';
	for (const t of all) chips.append(chip(`${t.name} ${t.count}`, t.id === wallTopic, () => { wallTopic = t.id; render(); }));
	s.append(chips);
	const grid = el('div', null, 'walls');
	const none = el('button', 'None', 'wall none'); none.type = 'button';
	none.setAttribute('aria-pressed', String(!root.dataset.wallpaper && !randomOn)); none.onclick = () => { store.set('read.wallRandom', null); setWallpaper(null); render(); };
	grid.append(none);
	for (const w of library.wallpapers.filter((w) => wallTopic === 'all' || w.topic === wallTopic)) {
		const b = el('button', null, 'wall'); b.type = 'button';
		b.style.backgroundColor = w.colors?.[0] || '';
		b.style.backgroundImage = `url("/api/wallpapers/${encodeURIComponent(w.id)}/thumb")`;
		b.setAttribute('aria-label', `Wallpaper ${w.id}`);
		b.setAttribute('aria-pressed', String(!randomOn && root.dataset.wallpaper === w.id));
		b.onclick = () => { store.set('read.wallRandom', null); setWallpaper(w.id); render(); };
		grid.append(b);
	}
	s.append(grid);

	const slider = (label, key, cssVar, min, def, disabled) => {
		const row = el('label', null, 'slider small');
		const input = el('input'); input.type = 'range'; input.min = String(min); input.max = '100'; input.step = '1';
		const val = el('span', null, 'val');
		input.value = store.get(key, String(def)); val.textContent = input.value + '%';
		input.disabled = disabled;
		input.oninput = () => { val.textContent = setPercent(cssVar, key, input.value, min) + '%'; };
		row.append(el('span', label), input, val);
		return row;
	};
	s.append(el('h3', 'Windows'));
	s.append(slider('Window opacity', 'read.opacity', '--win', 50, 100, !root.dataset.wallpaper));
	if (!root.dataset.wallpaper) s.append(el('p', 'The window opacity needs a wallpaper behind it.', 'small muted'));
	s.append(slider('List item shade', 'read.itemShade', '--shade', 0, 40, false));
	s.append(el('p', 'How much darker the items in a list (readings, Bible books) are than the window.', 'small muted'));
	pane.append(s);
}

// --- Drawing ------------------------------------------------------------------------
function render() {
	const h = parseHash();
	document.body.classList.toggle('settings-open', Boolean(h.settings));
	if (h.settings) { $('settings-pane').replaceChildren(); renderSettings($('settings-pane')); setTabs(null); return; }
	const entry = h.entry != null ? entries.find((x) => x.id === h.entry) : null;
	// On a phone, show what was opened last; after a reload, the reading wins over the Bible.
	if (!wide.matches) {
		if (focus === 'reading' && !entry) focus = h.bible ? 'bible' : 'list';
		if (focus === 'bible' && !h.bible) focus = entry ? 'reading' : 'list';
		if (focus === 'list' && entry) focus = 'reading';
		if (focus === 'list' && h.bible) focus = 'bible';
	}
	const listPane = $('list-pane'), readingPane = $('reading-pane'), biblePane = $('bible-pane');
	listPane.replaceChildren(); readingPane.replaceChildren(); biblePane.replaceChildren();
	renderList(listPane, entry?.id);
	if (entry) renderEntry(readingPane, entry);
	else {
		const note = el('p', 'Choose a reading on the left.', 'empty');
		readingPane.append(note);
	}
	if (h.bible) renderBible(biblePane, h.bible);
	const cols = $('columns');
	cols.classList.toggle('no-bible', !h.bible);
