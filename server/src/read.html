	cols.classList.toggle('no-reading', Boolean(h.bible) && !entry);
	for (const [pane, name] of [[listPane, 'list'], [readingPane, 'reading'], [biblePane, 'bible']]) pane.classList.toggle('shown', focus === name);
	setTabs(h);
	applySplit();
	if (!wide.matches && focus !== 'list') window.scrollTo(0, 0);
}
function setTabs(h) {
	for (const b of document.querySelectorAll('[data-tab]')) {
		const t = b.dataset.tab;
		let on;
		if (!h) on = false;
		else if (t === 'bible') on = wide.matches ? Boolean(h.bible) : focus === 'bible';
		else on = t === listTab && (wide.matches || focus !== 'bible');
		b.setAttribute('aria-selected', String(on));
	}
}
window.addEventListener('hashchange', render);
wide.addEventListener('change', render);
for (const b of document.querySelectorAll('[data-tab]')) b.onclick = () => {
	const t = b.dataset.tab;
	// From the settings page any tab goes back to reading; settings are saved as they change.
	if (parseHash().settings) {
		if (t !== 'bible') { listTab = t; store.set('read.tab', t); }
		history.replaceState(null, '', location.pathname + location.search);
		if (t !== 'bible') { focus = 'list'; render(); return; }
	}
	if (t === 'bible') {
		const h = parseHash();
		if (wide.matches && h.bible) { render(); return; }
		let pos = null; try { pos = JSON.parse(store.get('read.biblePos', 'null')); } catch {}
		const version = defaultVersion();
		go({ bible: pos && pos.version === version ? pos : { version: version || 'none', book: null } }, 'bible');
		return;
	}
	listTab = t; store.set('read.tab', t);
	if (!wide.matches) go({}, 'list'); else render();
};

// The divider between the reading and the Bible: drag (or arrow keys) to share the width.
function applySplit() {
	const r = Number(getComputedStyle(root).getPropertyValue('--split')) || 0.5;
	const cols = $('columns');
	cols.style.setProperty('--split-left', `${r}fr`);
	cols.style.setProperty('--split-right', `${1 - r}fr`);
}
function setSplit(r) {
	r = Math.max(0.2, Math.min(0.8, r));
	root.style.setProperty('--split', r);
	store.set('read.split', r.toFixed(3));
	applySplit();
}
(() => {
	const handle = $('handle');
	handle.addEventListener('pointerdown', (ev) => {
		const reading = $('reading-pane').getBoundingClientRect(), bibleBox = $('bible-pane').getBoundingClientRect();
		const left = reading.left, total = bibleBox.right - reading.left;
		handle.setPointerCapture(ev.pointerId); handle.classList.add('dragging');
		const move = (e) => setSplit((e.clientX - left) / total);
		const up = () => { handle.classList.remove('dragging'); handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); };
		handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up);
	});
	handle.addEventListener('keydown', (ev) => {
		const r = Number(getComputedStyle(root).getPropertyValue('--split')) || 0.5;
		if (ev.key === 'ArrowLeft') setSplit(r - 0.05); else if (ev.key === 'ArrowRight') setSplit(r + 0.05); else return;
		ev.preventDefault();
	});
	handle.addEventListener('dblclick', () => setSplit(0.5));
})();

// The panes sit under the header on a desktop.
function measureTop() { requestAnimationFrame(() => root.style.setProperty('--top-h', $('top').offsetHeight + 'px')); }
window.addEventListener('resize', measureTop);

// With "new each time" the wallpaper is chosen once the list has loaded, so the old one never flashes.
const randomWall = Boolean(store.get('read.wallRandom', null));
let freshFromStart = false;
try { freshFromStart = sessionStorage.getItem('wallFresh') === '1'; sessionStorage.removeItem('wallFresh'); } catch {}
if (!randomWall || freshFromStart) applyWallpaper();
Promise.all([
	getJson('/api/entries'),
	getJson('/api/voices').catch(() => ({ voices: [], default: null })),
	getJson('/api/bibles').catch(() => ({ bibles: [] })),
	getJson('/api/wallpapers').catch(() => ({ topics: [], wallpapers: [] })),
	loadProfileBibles(),
	loadNotes(),
]).then(([list, v, b, w]) => {
	entries = list.entries || []; voices = v; serverBibles = b.bibles || []; bibleAudio = Boolean(b.audio); library = w;
	// The start page has just chosen one; otherwise choose now (or show the last one if none can be).
	if (randomWall && !freshFromStart && !pickRandomWallpaper()) applyWallpaper();
	const h = parseHash();
	focus = h.entry ? 'reading' : h.bible ? 'bible' : 'list';
	// Opened on a reading: start on its list. After that the lists are free, whatever is open.
	const opened = h.entry != null ? entries.find((x) => x.id === h.entry) : null;
	if (opened) listTab = kindOf(opened);
	render();
	// First visit in this browser: ask who is reading (once, unless they choose a name).
	if (!profile && store.get('read.askedProfile') !== '1') askProfile();
}).catch(() => { $('list-pane').replaceChildren(el('p', 'Could not load the readings. Try again in a moment.', 'empty')); });
</script>
