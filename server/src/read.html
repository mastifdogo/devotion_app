<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devotion</title>
<script>
try { const t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root { color-scheme: light; --bg:#f6f4ef; --card:#fff; --ink:#22201c; --muted:#6b665d; --line:#ddd8cc; --accent:#3d5a80; }
:root[data-theme="dark"] { color-scheme: dark; --bg:#191816; --card:#232220; --ink:#ece8df; --muted:#a39d91; --line:#3a3834; --accent:#8fb3de; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg:#191816; --card:#232220; --ink:#ece8df; --muted:#a39d91; --line:#3a3834; --accent:#8fb3de; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui, sans-serif; }
main { max-width:42rem; margin:0 auto; padding:0 1rem 4rem; }
header { position:sticky; top:0; z-index:2; background:var(--bg); padding:.8rem 0 0; border-bottom:1px solid var(--line); margin-bottom:1rem; }
.bar { display:flex; align-items:center; gap:.6rem; }
.bar h1 { font-size:1.25rem; margin:0; flex:1; }
.bar a, .bar button { color:var(--accent); text-decoration:none; background:none; border:0; font:inherit; font-size:.9rem; cursor:pointer; padding:.3rem 0; }
.tabs { display:flex; gap:1.4rem; margin-top:.5rem; }
.tabs button { background:none; border:0; border-bottom:3px solid transparent; padding:.5rem 0; font:inherit; font-weight:600; color:var(--muted); cursor:pointer; }
.tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
.item { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:.8rem .9rem; margin:0 0 .6rem; color:var(--ink); text-decoration:none; }
.item:hover { border-color:var(--accent); }
.label { font-size:.8rem; font-weight:600; color:var(--accent); text-transform:none; }
.title { font-weight:600; font-size:1.05rem; margin:.1rem 0; }
.muted { color:var(--muted); } .small { font-size:.85rem; }
.summary { color:var(--muted); font-size:.92rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.pill { display:inline-block; font-size:.72rem; border:1px solid var(--line); border-radius:999px; padding:0 .5rem; margin-left:.4rem; color:var(--muted); vertical-align:middle; }
article h2 { font-size:1.5rem; line-height:1.25; margin:.2rem 0 .3rem; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:.9rem 1rem; margin:1rem 0; }
.player { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; }
.player audio { width:100%; }
.player select { font:inherit; font-size:.85rem; padding:.25rem .4rem; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
.body p { margin:0 0 1em; }
.body p.head { font-weight:600; margin-top:1.4em; }
.empty { text-align:center; color:var(--muted); padding:3rem 0; }
</style>
</head>
<body>
<main>
<header>
	<div class="bar"><h1>Devotion</h1><button id="theme" type="button"></button><a href="/">Home</a></div>
	<div class="tabs" role="tablist">
		<button role="tab" data-tab="daily_reading">Daily readings</button>
		<button role="tab" data-tab="lesson">Lessons</button>
	</div>
</header>
<div id="view"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const store = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let entries = [], voices = { voices: [], default: null }, tab = store.get('read.tab', 'daily_reading');

// Dates are written out in the reader's own language; the date is taken at noon UTC so no time zone moves it a day.
const day = (iso, opts) => iso && /^\d{4}-\d{2}-\d{2}/.test(iso) ? new Date(iso.slice(0, 10) + 'T12:00:00Z').toLocaleDateString(undefined, { timeZone: 'UTC', ...opts }) : '';
const kindOf = (e) => (e.kind === 'lesson' ? 'lesson' : 'daily_reading');
function heading(e) {
	if (kindOf(e) === 'lesson') {
		const parts = [e.lesson_number ? `Lesson ${e.lesson_number}` : '', day(e.entry_date, { month: 'long', day: 'numeric', year: 'numeric' })].filter(Boolean);
		return parts.join(' · ') || 'Lesson';
	}
	return day(e.entry_date || e.created_at, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}
const sortKey = (e) => (e.entry_date || e.created_at || '') + '|' + (e.created_at || '') + '|' + String(e.id).padStart(9, '0');

function renderTheme() {
	const t = document.documentElement.dataset.theme || 'auto';
	$('theme').textContent = { auto: 'Theme: system', light: 'Theme: light', dark: 'Theme: dark' }[t];
}
$('theme').onclick = () => {
	const next = { auto: 'light', light: 'dark', dark: 'auto' }[document.documentElement.dataset.theme || 'auto'];
	if (next === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = next;
	try { next === 'auto' ? localStorage.removeItem('theme') : localStorage.setItem('theme', next); } catch {}
	renderTheme();
};
for (const b of document.querySelectorAll('[data-tab]')) b.onclick = () => { tab = b.dataset.tab; store.set('read.tab', tab); location.hash = ''; render(); };

function renderList(view) {
	const list = entries.filter((e) => kindOf(e) === tab).sort((a, b) => sortKey(b).localeCompare(sortKey(a)));
	if (!list.length) { view.append(el('p', tab === 'lesson' ? 'No lessons yet.' : 'No daily readings yet.', 'empty')); return; }
	for (const e of list) {
		const a = el('a', null, 'item'); a.href = `#/entry/${e.id}`;
		const label = el('div', heading(e), 'label');
		if (kindOf(e) === 'daily_reading' && e.lesson_number) label.append(el('span', `Lesson ${e.lesson_number}`, 'pill'));
		if (e.archived) label.append(el('span', 'Archived', 'pill'));
		a.append(label, el('div', e.title, 'title'));
		if (e.summary) a.append(el('div', e.summary, 'summary'));
		view.append(a);
	}
}

function renderEntry(view, e) {
	const back = el('a', '← Back', 'small'); back.href = '#'; back.style.color = 'var(--accent)';
	const art = el('article');
	art.append(back, el('div', heading(e), 'label'), el('h2', e.title));
	if (e.scripture) art.append(el('div', e.scripture, 'muted'));
	if (e.summary) { const s = el('div', null, 'card'); s.append(el('div', 'Summary', 'label'), el('div', e.summary)); art.append(s); }

	const audio = (e.audio && e.audio.length) ? e.audio : e.has_audio ? [{ voice: '' }] : [];
	if (audio.length) {
		const box = el('div', null, 'card player');
		const player = el('audio'); player.controls = true; player.preload = 'none';
		const voiceSel = el('select'); voiceSel.setAttribute('aria-label', 'Voice');
		const nameOf = (id) => voices.voices.find((v) => v.id === id)?.name || id || 'Default voice';
		for (const a of audio) { const o = el('option', nameOf(a.voice)); o.value = a.voice; voiceSel.append(o); }
		const preferred = store.get('read.voice', voices.default || '');
		voiceSel.value = audio.some((a) => a.voice === preferred) ? preferred : audio.some((a) => a.voice === voices.default) ? voices.default : audio[0].voice;
		const speedSel = el('select'); speedSel.setAttribute('aria-label', 'Speed');
		for (const s of ['0.75', '1', '1.25', '1.5', '1.75', '2']) { const o = el('option', s + '×'); o.value = s; speedSel.append(o); }
		speedSel.value = store.get('read.speed', '1');
		const load = (keepTime) => {
			const t = player.currentTime, playing = !player.paused;
			player.src = `/api/entries/${e.id}/audio` + (voiceSel.value ? `?voice=${encodeURIComponent(voiceSel.value)}` : '');
			player.playbackRate = Number(speedSel.value);
			if (keepTime) player.addEventListener('loadedmetadata', () => { player.currentTime = t; if (playing) player.play().catch(() => {}); }, { once: true });
		};
		voiceSel.onchange = () => { store.set('read.voice', voiceSel.value); load(true); };
		speedSel.onchange = () => { store.set('read.speed', speedSel.value); player.playbackRate = Number(speedSel.value); };
		player.addEventListener('play', () => { player.playbackRate = Number(speedSel.value); });
		load(false);
		box.append(player);
		if (audio.length > 1) box.append(voiceSel);
		box.append(speedSel);
		art.append(box);
	}

	const body = el('div', null, 'body');
	if (e.body) {
		for (const para of e.body.split(/\n{2,}/)) {
			const text = para.trim(); if (!text) continue;
			// A short line on its own ("Prayer", "Lesson Scripture") reads as a heading.
			body.append(el('p', text, text.length < 40 && !/[.!?”"]$/.test(text) ? 'head' : ''));
		}
	} else if (e.archived) {
		body.append(el('p', 'Archived on the server: the full text is no longer available here.', 'muted'));
	}
	art.append(body);
	view.append(art);
}

function render() {
	for (const b of document.querySelectorAll('[data-tab]')) b.setAttribute('aria-selected', String(b.dataset.tab === tab));
	const view = $('view'); view.replaceChildren();
	const m = /^#\/entry\/(\d+)$/.exec(location.hash);
	const entry = m && entries.find((e) => e.id === Number(m[1]));
	if (entry) { renderEntry(view, entry); window.scrollTo(0, 0); } else renderList(view);
}
window.addEventListener('hashchange', render);

renderTheme();
Promise.all([
	fetch('/api/entries').then((r) => r.json()),
	fetch('/api/voices').then((r) => (r.ok ? r.json() : { voices: [], default: null })).catch(() => ({ voices: [], default: null })),
]).then(([list, v]) => {
	entries = list.entries || []; voices = v;
	// Open on the tab of an entry linked to directly.
	const m = /^#\/entry\/(\d+)$/.exec(location.hash);
	const linked = m && entries.find((e) => e.id === Number(m[1]));
	if (linked) tab = kindOf(linked);
	render();
}).catch(() => { $('view').replaceChildren(el('p', 'Could not load the entries. Try again in a moment.', 'empty')); });
</script>
</body>
</html>
