# One-off helper: prints the SHA-256 of the Piper voices offered in the admin
# page, so they can be pinned in server/src/voices.js.
name: Voice checksums
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sums:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          base=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0
          for v in en/en_US/lessac/medium/en_US-lessac-medium en/en_US/amy/medium/en_US-amy-medium en/en_US/ryan/medium/en_US-ryan-medium en/en_US/joe/medium/en_US-joe-medium en/en_US/hfc_female/medium/en_US-hfc_female-medium en/en_US/hfc_male/medium/en_US-hfc_male-medium en/en_GB/alan/medium/en_GB-alan-medium en/en_GB/jenny_dioco/medium/en_GB-jenny_dioco-medium en/en_GB/northern_english_male/medium/en_GB-northern_english_male-medium es/es_ES/davefx/medium/es_ES-davefx-medium es/es_MX/claude/high/es_MX-claude-high; do
            for ext in onnx onnx.json; do
              if curl -fsSL --retry 3 -o f "$base/$v.$ext"; then echo "VOICE $v.$ext $(sha256sum f | cut -d' ' -f1) $(wc -c < f)"; else echo "VOICE $v.$ext MISSING"; fi
            done
          done
